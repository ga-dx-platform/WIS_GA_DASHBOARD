 class=\"rw\"><span>Closed on the report day<\/span><b>${same} of ${n}<\/b><\/div><div class=\"rw\"><span>Job sheet dated after the work<\/span><b>${U.filter(j=>j.pre).length}<\/b><\/div>`;\n const note=name===\"Vendor\"?\"Days = report date → completion date in the file.\":\"Days to finish is not shown: many job sheets are issued after the work was done.\";\n const listBlock=name===\"Vendor\"\n  ?`<div class=\"dv\"><h5>Every vendor job <span>days · cost<\/span><\/h5>${U.map(j=>`<div class=\"rw\"><span>${dfmt(j.d)} · ${(j.t||j.ty).slice(0,24)}<\/span><b style=\"color:${j.open?\"var(--up)\":\"inherit\"}\">${j.lead} d${j.open?\" open\":\"\"} · ${j.cost==null?\"TBD\":k1(j.cost)}<\/b><\/div>`).join(\"\")}<\/div>`\n  :`<div class=\"dv\"><h5>Largest jobs <span>by cost<\/span><\/h5>${big5.map(j=>`<div class=\"rw\"><span>${dfmt(j.d)} · ${j.fl===\"-\"?\"\":\"F\"+j.fl+\" · \"}${(j.t||j.ty).slice(0,22)}<\/span><b>${baht(j.cost)}<\/b><\/div>`).join(\"\")||'<div class=\"rw\"><span>none<\/span><\/div>'}<\/div>`;\n Kit.drawer.open(`<div class=\"ttl\"><span class=\"dot\" style=\"background:${EXC[name]}\"><\/span>${EXN[name]} · detail<\/div>\n <div class=\"sub\" style=\"margin-bottom:8px\">${MN[0]}${L?\" – \"+MS(L):\"\"}${L<LAT?\" · selected month\":\"\"}<\/div>\n <div style=\"display:flex;align-items:flex-end;justify-content:space-between\"><div class=\"big num\">${n}<small>jobs<\/small><\/div><span class=\"pill ${name===\"Vendor\"?\"\":\"dn\"}\">${pc(n,all.length)}% of jobs · ${pc(cs,sum(all.map(j=>j.cost)))}% of cost<\/span><\/div>\n <div class=\"dv\"><h5>Cost <span>entered amounts only<\/span><\/h5><div class=\"rw\"><span>Total<\/span><b>${baht(cs)}<\/b><\/div><div class=\"rw\"><span>Average per job (with cost)<\/span><b>${withC?baht(cs/withC):\"-\"}<\/b><\/div><div class=\"rw\"><span>Jobs without cost<\/span><b>${n-withC}<\/b><\/div><\/div>\n <div class=\"dv\"><h5>Time<\/h5>${leadRow}<div style=\"font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.35\">${note}<\/div><\/div>\n <div class=\"dv\"><h5>Jobs per month <span>${MN[0]}–${MN[N-1]}<\/span><\/h5>${spark(arr,L,EXC[name],330,38)}<\/div>\n <div class=\"dv\"><h5>Work types<\/h5>${gs.map(([g,c])=>`<div class=\"rw\"><span style=\"width:116px\">${g.k}<\/span><span style=\"flex:1;align-self:center\"><i style=\"display:block;height:7px;border-radius:2px;background:${g.c};width:${c/gm*100}%\"><\/i><\/span><b>${c}<\/b><\/div>`).join(\"\")}<\/div>\n ${listBlock}\n <div class=\"dv\"><h5>Floors with most jobs <span>detail only here<\/span><\/h5>${topF.map(([f,c])=>`<div class=\"rw\"><span>Floor ${f}<\/span><b>${c}<\/b><\/div>`).join(\"\")}<\/div>`);\n}\nconst mchips=fn=>`<div class=\"mchips\">${FYM.map((m,i)=>{const [c,t]=fn(i);return `<div class=\"${c}\">${m}${t?\"<br>\"+t:\"\"}<\/div>`}).join(\"\")}<\/div>`;\nfunction openPM(i){\n const p=PM[i];Kit.set(\"pin\",\"pm\"+i);\n let body=\"\";\n if(p.scope){\n  body=`<div style=\"display:flex;align-items:flex-end;justify-content:space-between\"><div class=\"big num\">${p.normal}<small>of ${p.scope} normal<\/small><\/div><span class=\"pill ${p.abn?\"\":\"dn\"}\">${p.abn?p.abn+\" abnormal\":\"all normal\"}<\/span><\/div>\n  <div class=\"dv\"><h5>Inspection <span>data to Aug 2026<\/span><\/h5><div class=\"rw\"><span>In scope<\/span><b>${p.scope}<\/b><\/div><div class=\"rw\"><span>Checked<\/span><b>${p.checked}<\/b><\/div><div class=\"rw\"><span>Abnormal<\/span><b>${p.abn}<\/b><\/div><div class=\"rw\"><span>Not yet checked<\/span><b>${p.pend}<\/b><\/div><\/div>`;\n  if(i===0)body+=`<div class=\"dv\"><h5>Normal rate by month <span>* assumed on plan<\/span><\/h5>${mchips(k=>k>=6?[\"p\",\"\"]:EL_RATE[k]==null?[\"n\",\"n/r\"]:[k<4?\"p\":\"d\",EL_RATE[k]+(k<4?\"*\":\"\")])}<\/div>\n  <div class=\"dv\"><h5>Follow-up <span>3 fault locations<\/span><\/h5>${EL_FU.map(f=>`<div class=\"ac\"><i style=\"background:${f[3]===\"ok\"?\"#4E7A4C\":\"#D9673E\"}\">${f[0].slice(3)}<\/i><div>${f[1]}<br><span class=\"pend\">${f[2].toUpperCase()}<\/span>${f[3]===\"ok\"?\"\":'<span class=\"pend\">OWNER TBD<\/span>'}<\/div><\/div>`).join(\"\")}<\/div>`;\n } else if(p.isNew){\n  body=`<div style=\"display:flex;align-items:flex-end;justify-content:space-between\"><div class=\"big num\" style=\"font-size:30px\">Monthly<\/div><span class=\"pill dn\">external vendor<\/span><\/div>\n  <div class=\"dv\"><h5>Programme <span>added 3 Oct 2026<\/span><\/h5><div class=\"rw\"><span>Area<\/span><b>Garden, floor ${GARDEN.floor}<\/b><\/div><div class=\"rw\"><span>Frequency<\/span><b>${GARDEN.freq}<\/b><\/div><div class=\"rw\"><span>Done by<\/span><b>${GARDEN.who}<\/b><\/div><div class=\"rw\"><span>Visits recorded<\/span><b>${GARDEN.log.length}<\/b><\/div><\/div>\n  <div class=\"dv\"><h5>Visit calendar FY26 <span>n/r = not recorded<\/span><\/h5>${mchips(k=>GARDEN.log.some(l=>l.m===k)?[\"d\",\"done\"]:k<=LAT?[\"n\",\"n/r\"]:[\"p\",\"plan\"])}<\/div>\n  <div class=\"dv\"><h5>Open data <span>needed from GA / vendor<\/span><\/h5><div class=\"ac\"><i style=\"background:#D9673E\">1<\/i><div>Last visit date and result<br><span class=\"pend\">DATA PENDING<\/span><\/div><\/div><div class=\"ac\"><i style=\"background:#D9673E\">2<\/i><div>Visit dates Apr–Sep<br><span class=\"pend\">DATA PENDING<\/span><\/div><\/div><div class=\"ac\"><i style=\"background:#4E7A4C\">3<\/i><div>Owner for checking each visit<br><span class=\"pend\">OWNER TBD<\/span><span class=\"pend\">DATE TBD<\/span><\/div><\/div><\/div>`;\n } else {\n  body=`<div style=\"display:flex;align-items:flex-end;justify-content:space-between\"><div class=\"big num\" style=\"font-size:30px\">${p.st}<\/div><span class=\"pill dn\">no unit count<\/span><\/div>\n  <div class=\"dv\"><h5>Programme<\/h5><div class=\"rw\"><span>Status<\/span><b>${p.st}<\/b><\/div><div class=\"rw\"><span>Note<\/span><b>${p.note}<\/b><\/div><\/div>`;\n  if(p.kk===\"Air Condition Cleaning\")body+=`<div class=\"dv\"><h5>Rounds FY26 <span>plan<\/span><\/h5>${mchips(k=>k===1||k===2?[\"d\",\"R1\"]:k===6||k===7?[\"p\",\"R2\"]:[\"\",\"\"])}<\/div>`;\n }\n Kit.drawer.open(`<div class=\"ttl\"><span class=\"dot\" style=\"background:var(--leaf)\"><\/span>${p.kk} · PM<\/div><div class=\"sub\" style=\"margin-bottom:8px\">PM board<\/div>${body}`);\n}\n\n/* ====== month scrubber wiring ====== */\nfunction setMonthUI(L){\n $(\"mLbl\").textContent=MS(L);$(\"mLbl\").classList.toggle(\"past\",L!==LAT);\n $(\"mTag\").classList.remove(\"on\");\n $(\"mPrev\").disabled=L===0;$(\"mNext\").disabled=L===N-1;\n}\nKit.on((k,v,st)=>{\n if(k===\"m\"){Kit.hideTip();renderK(v);selWall(v);setMonthUI(v);\n   if(Kit.drawer.isOpen()){if(EXK.includes(st.pin))openEx(st.pin);else if(st.pin===\"types\")openTypes()}}\n if(k===\"ex\")applyEx(v);\n if(k===\"pin\"&&v==null&&!Kit.drawer.isOpen())Kit.set(\"ex\",null);\n});\n$(\"mPrev\").onclick=()=>Kit.set(\"m\",Math.max(0,Kit.st.m-1));\n$(\"mNext\").onclick=()=>Kit.set(\"m\",Math.min(N-1,Kit.st.m+1));\n$(\"mLatest\").onclick=()=>Kit.set(\"m\",LAT);\n\n/* ====== story / presenter mode (4 scenes) ====== */\nconst reset=()=>{Kit.set(\"ex\",null);Kit.set(\"pin\",null);Kit.set(\"m\",LAT)};\nconst ST=Kit.story([\n {cards:[\"cPM\",\"cEL\"],enter:reset,cap:()=>`<b>PM: ${pmOk} of ${PM.length} programmes are fine.<\/b> Emergency light has tripped — ${elP.abn} faulty of ${elP.scope} — and the new monthly garden visits have no records yet.`},\n {cards:[\"cK1\",\"cWall\"],enter:()=>{Kit.set(\"ex\",null);Kit.set(\"m\",LAT)},cap:()=>`<b>${TOT} repair jobs in six months<\/b> — ${cnt[LAT]} in ${MN[LAT]}, about ${Math.round(sum(cnt.slice(3))/3)} a month since ${MN[3]}. Most are lamp changes by SRE.`},\n {cards:[\"cK2\",\"cWall\"],enter:()=>Kit.set(\"m\",0),leave:reset,cap:()=>`<b>${MN[0]} set the bill:<\/b> ${k1(costM[0])} in one month (${pc(costM[0],TOTC)}% of ${k1(TOTC)}), mostly one vendor desk project. Since ${MN[2]} it is ${k1(Math.min(...costM.slice(2)))}–${k1(Math.max(...costM.slice(2)))} a month.`},\n {cards:[\"cK3\",\"cTk\",\"cBand\"],enter:()=>{Kit.set(\"m\",LAT);Kit.set(\"ex\",\"Vendor\")},leave:reset,cap:()=>`<b>${openJobs.length} vendor jobs are open past ${LATEDAYS} days.<\/b> Next: clear the emergency-light faults, log garden visits, fill ${sum(noC)} blank costs.`}\n]);\n$(\"btnStory\").onclick=()=>ST.active()?ST.stop():ST.start();\n\n/* ====== keyboard ====== */\naddEventListener(\"keydown\",e=>{\n if(e.target.closest&&e.target.closest(\"button\")&&(e.key===\"Enter\"||e.key===\" \"))return;\n if(ST.active()){\n  if(e.key===\"ArrowRight\"||e.key===\" \"||e.key===\"PageDown\"){e.preventDefault();ST.next()}\n  else if(e.key===\"ArrowLeft\"||e.key===\"PageUp\"){e.preventDefault();ST.prev()}\n  else if(e.key===\"Escape\"||e.key===\"p\"||e.key===\"P\")ST.stop();\n  return;\n }\n if(e.key===\"Escape\"){Kit.drawer.close();Kit.set(\"ex\",null)}\n else if(e.key===\"ArrowLeft\"){Kit.set(\"m\",Math.max(0,Kit.st.m-1))}\n else if(e.key===\"ArrowRight\"){Kit.set(\"m\",Math.min(N-1,Kit.st.m+1))}\n else if(e.key===\"Home\"||e.key===\"End\"){Kit.set(\"m\",LAT)}\n else if(e.key===\"p\"||e.key===\"P\"){ST.start()}\n});\n\n/* ====== init + entrance ====== */\nconst stageEl=$(\"stage\");\nif(!Kit.RM){stageEl.classList.add(\"intro\");stageEl.querySelectorAll(\".card\").forEach((c,k)=>c.style.animationDelay=(k*.06)+\"s\");setTimeout(()=>{stageEl.classList.remove(\"intro\");stageEl.querySelectorAll(\".card\").forEach(c=>c.style.animationDelay=\"\")},3200)}\nKit.st.m=null;Kit.set(\"m\",LAT);\n\n/* ====== fit 16:10 stage to window ====== */\nfunction fit(){const s=Math.min(innerWidth/1600,innerHeight/1000);stageEl.style.transform=`scale(${s})`}\naddEventListener(\"resize\",fit);fit();\n<\/script>\n<script>/* GA SHELL BRIDGE (added by build_index.py, combined file only) */\n(()=>{if(parent===window)return;\nconst send=(t,x)=>parent.postMessage(Object.assign({ga:t},x||{}),\"*\");\nconst act=()=>{try{return ST.active()}catch(_){return false}};\nconst step1=()=>{const k=document.querySelector(\".cap .k,#cap .k\");return k?parseInt(k.textContent,10):0};\naddEventListener(\"keydown\",e=>{\n if(e.ctrlKey||e.metaKey||e.altKey)return;\n const k=e.key,was=act();\n const eat=()=>{e.preventDefault();e.stopImmediatePropagation()};\n if(/^[1-9]$/.test(k)){eat();send(\"go\",{n:+k});return}\n if(k===\"P\"&&e.shiftKey){eat();send(\"presentAll\");return}\n if(!was){\n  if(k===\"PageDown\"){eat();send(\"step\",{d:1})}\n  else if(k===\"PageUp\"){eat();send(\"step\",{d:-1})}\n  return;\n }\n if((k===\"PageUp\"||k===\"ArrowLeft\")&&step1()===1){send(\"storyBack\");return}\n setTimeout(()=>{if(!act())send(k===\"PageDown\"||k===\"ArrowRight\"||k===\" \"?\"storyEnd\":\"storyExit\")},0);\n},true);\naddEventListener(\"message\",e=>{const d=e.data||{};\n if(d.ga===\"story\"){try{if(!act())ST.start()}catch(_){}}\n if(d.ga===\"stop\"){try{if(act())ST.stop()}catch(_){}}\n});\nsend(\"ready\");\n})();\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script>
(()=>{
const META=[{"n": "01", "short": "Electric", "title": "Electric Consumption Monitor"}, {"n": "02", "short": "Irregularities", "title": "Building Irregularities Monitor"}, {"n": "03", "short": "Waste", "title": "Waste & Recyclables Monitor"}, {"n": "04", "short": "Copier", "title": "Copier & Printing Cost Monitor"}, {"n": "05", "short": "CCTV", "title": "CCTV Recording Retention Monitor"}, {"n": "06", "short": "Renovation", "title": "Renovation Projects & Ad-hoc Requests"}, {"n": "07", "short": "PM & Repair", "title": "Preventive Maintenance & Repair Monitor"}];
const FONTS=(document.querySelector("style")||{}).outerHTML||"";   /* first <style> = GA FONTS block */
const fr={}, ready={}, queue={};
let cur=-1, presentAll=false, hideT=0;
const host=document.getElementById("frames"), dock=document.getElementById("dock"), chips=document.getElementById("chips");

META.forEach((d,i)=>{
 const b=document.createElement("button");b.className="chip";b.title=d.title;
 b.innerHTML=`<span class="n">${d.n}</span><span class="t">${d.short}</span>`;
 b.onclick=()=>{presentAll=false;show(i)};chips.appendChild(b);
});
const chipEls=[...chips.children];

function frame(i){
 if(fr[i])return fr[i];
 const f=document.createElement("iframe");f.title=META[i].title;
 const src=JSON.parse(document.getElementById("d"+META[i].n).textContent);
 f.srcdoc=src.replace("<!--GA_FONTS-->",FONTS);
 host.appendChild(f);fr[i]=f;return f;
}
function post(i,msg){const f=fr[i];if(!f)return;if(ready[i])f.contentWindow.postMessage(msg,"*");else (queue[i]=queue[i]||[]).push(msg)}
function show(i,o={}){
 i=Math.max(0,Math.min(META.length-1,i));
 const f=frame(i);
 if(i!==cur){
  Object.values(fr).forEach(x=>x.classList.toggle("on",x===f));
  chipEls.forEach((c,k)=>c.setAttribute("aria-current",k===i?"page":"false"));
  cur=i;
  history.replaceState(null,"","#"+META[i].n);
  document.title=META[i].n+" · "+META[i].title+" · GA Dashboard Series";
 }
 if(o.story)post(i,{ga:"story"});
 setTimeout(()=>{try{f.contentWindow.focus()}catch(_){}},30);
 if(!presentAll)peek(1800);
 document.getElementById("pAll").classList.toggle("live",presentAll);
}
function peek(ms){dock.classList.add("show");clearTimeout(hideT);if(ms)hideT=setTimeout(()=>{if(!dock.matches(":hover"))dock.classList.remove("show")},ms)}

addEventListener("message",e=>{
 const d=e.data||{};if(!d.ga)return;
 const i=Object.keys(fr).find(k=>fr[k].contentWindow===e.source);if(i===undefined)return;
 const n=+i;
 if(d.ga==="ready"){ready[n]=true;(queue[n]||[]).forEach(m=>fr[n].contentWindow.postMessage(m,"*"));queue[n]=[];return}
 if(n!==cur)return;
 if(d.ga==="go"){if(d.n<=META.length){presentAll=false;show(d.n-1)}}
 else if(d.ga==="step"){show(cur+d.d)}
 else if(d.ga==="presentAll"){presentAll=true;show(cur,{story:true})}
 else if(d.ga==="storyEnd"){if(presentAll){if(cur<META.length-1)show(cur+1,{story:true});else{presentAll=false;show(cur)}}}
 else if(d.ga==="storyBack"){if(presentAll&&cur>0)show(cur-1,{story:true})}
 else if(d.ga==="storyExit"){presentAll=false;show(cur)}
});

/* keys while focus is on the shell itself (dock buttons) */
addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(/^[1-9]$/.test(e.key)&&+e.key<=META.length){presentAll=false;show(+e.key-1)}
 else if(e.key==="PageDown"){e.preventDefault();show(cur+1)}
 else if(e.key==="PageUp"){e.preventDefault();show(cur-1)}
});
document.getElementById("pAll").onclick=()=>{presentAll=true;dock.classList.remove("show");show(0,{story:true})};
document.getElementById("hot").addEventListener("mouseenter",()=>peek(0));
dock.addEventListener("mouseleave",()=>peek(900));
addEventListener("hashchange",()=>{const k=META.findIndex(d=>"#"+d.n===location.hash);if(k>=0&&k!==cur)show(k)});

const start=META.findIndex(d=>"#"+d.n===location.hash);
show(start>=0?start:0);peek(3000);
})();
</script>
