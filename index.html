:root{--navy:#13294B;--paper:#F3F0E9;--ink:#1B2230;--mute:#8A8F98;--amber:#E8B04A;--back:#2A2F38}

#hot{position:fixed;left:0;right:0;bottom:0;height:14px;z-index:5}
#dock{position:fixed;left:50%;bottom:14px;z-index:6;transform:translate(-50%,calc(100% + 24px));
 display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;background:rgba(19,41,75,.96);color:#fff;
 border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .28s cubic-bezier(.2,.7,.2,1)}
#dock.show{transform:translate(-50%,0)}

#dock nav{display:flex;gap:2px}

.chip{display:flex;align-items:baseline;gap:7px;padding:7px 11px;border-radius:5px;font-size:12.5px;color:#C9D3E3;white-space:nowrap}
.chip .n{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:#fff;opacity:.75}
#dock .chip:hover{background:rgba(255,255,255,.08);color:#fff}
#dock .chip[aria-current="page"]{background:var(--paper);color:var(--ink)}
.chip[aria-current="page"] .n{color:var(--navy);opacity:1}
.chip:focus-visible,#pAll:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 4px}
#pAll{padding:7px 12px;border-radius:5px;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.35)!important;white-space:nowrap}
#dock #pAll:hover{background:rgba(255,255,255,.08)}

#dock .keys b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:#C9D3E3}

@media (prefers-reduced-motion:reduce){#dock{transition:none}}

);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font:600 13px/26px \"IBM Plex Mono\",ui-monospace,monospace;text-align:center}\n.up{color:var(--up);font-weight:600}\n.hl{color:var(--up);font-size:14px;display:block;margin-top:2px}\n.factor .ttl{letter-spacing:.7px}\n.draft{font-size:11px;color:#8A6D1F;background:#F7EDCF;border-radius:3px;padding:2px 7px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;margin-left:auto}\n/* insights */\n.ins{list-style:none;margin-top:10px}\n.ins li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.6px;line-height:1.42;color:var(--ink2)}\n.ins li:first-child{border-top:0}\n.ins li b{color:var(--ink);font-weight:600}\n.ins .ic{width:26px;height:26px}\n.foot{position:absolute;left:24px;right:24px;bottom:10px;font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between;gap:20px}\n.foot b{color:var(--ink2);font-weight:600}\nsvg text{font-family:\"IBM Plex Sans\",sans-serif}\n\n/* ===== GA INTERACT KIT · styles (reusable) ===== */\n.hdr .meta{margin-left:18px}\n.ctl{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#C9D3E3}\n.ctl button{font:600 12px \"IBM Plex Sans\",sans-serif;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:4px;height:28px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}\n.ctl button:hover{background:rgba(255,255,255,.18)}\n.ctl button:focus-visible,.hit:focus-visible{outline:2px solid #E8B04A;outline-offset:2px}\n.ctl .mon{font:600 13px \"IBM Plex Mono\",monospace;color:#fff;min-width:64px;text-align:center}\n.ctl .mon.past{color:#E8B04A}\n.ctl .hint{font-size:11px;color:#8FA0BC;margin-left:6px;line-height:1.25}\n.card{transition:opacity .35s,filter .35s,box-shadow .35s,transform .35s}\n.card.dim{opacity:.16;filter:grayscale(.8)}\n.card.spot{box-shadow:0 0 0 3px var(--amber),0 12px 30px rgba(19,41,75,.18);z-index:5}\n.hit{cursor:pointer}\n#bldg .fz{transition:opacity .25s}\n#bldg .fz:focus{outline:none}\n#bldg .fz:focus-visible .rowbg{stroke:var(--amber);stroke-width:2}\n#bldg .fz text,#bldg .fz path,#bldg .fz circle{pointer-events:none}\n#bldg .fz.dim{opacity:.18}\n#bldg .fz.on .rowbg{fill:#F4EFE4}\n#bldg polygon.band{transition:opacity .25s,filter .25s}\n#bldg polygon.band.dim{opacity:.12}\n#bldg polygon.band.on{filter:drop-shadow(0 0 5px #FFD27A) brightness(1.08)}\n.tip{position:absolute;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(19,41,75,.22);padding:10px 12px;font-size:12px;color:var(--ink2);min-width:180px;max-width:280px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}\n.tip.on{opacity:1;transform:none}\n.tip h4{font:600 12.5px \"IBM Plex Sans\",sans-serif;color:var(--ink);margin-bottom:4px}\n.tip .r{display:flex;justify-content:space-between;gap:14px;font-family:\"IBM Plex Mono\",monospace;font-size:11.5px;line-height:1.55}\n.tip .r b{color:var(--ink)}\n.tip .n{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.35}\n.drawer{position:absolute;top:84px;right:24px;width:384px;height:878px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:-14px 0 40px rgba(19,41,75,.18);z-index:30;padding:16px 18px;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:hidden}\n.drawer.open{transform:none}\n.drawer .x{position:absolute;right:12px;top:10px;width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:16px;color:var(--ink2);cursor:pointer}\n.drawer .dv{border-top:1px solid var(--line);padding:10px 0}\n.drawer .dv h5{font:600 13px \"IBM Plex Sans\",sans-serif;color:var(--ink);display:flex;justify-content:space-between}\n.drawer .dv h5 span{font:500 11px \"IBM Plex Mono\",monospace;color:var(--mute)}\n.cap{position:absolute;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--navy);color:#fff;border-radius:8px;padding:12px 18px;font-size:16px;line-height:1.4;max-width:900px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;transition:opacity .3s,transform .3s;pointer-events:none}\n.cap.on{opacity:1;transform:translate(-50%,0)}\n.cap .k{font:600 12px \"IBM Plex Mono\",monospace;color:#E8B04A;white-space:nowrap}\n.cap .h{font-size:11px;color:#8FA0BC;white-space:nowrap}\n.cap b{color:#FFD27A}\n/* entrance */\n@keyframes rise{from{opacity:0;transform:translateY(10px)}}\n@keyframes gy{from{transform:scaleY(0)}}\n@keyframes gx{from{transform:scaleX(0)}}\n@keyframes lite{from{opacity:0}}\n.intro .card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}\n.intro .gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .7s cubic-bezier(.2,.8,.2,1) both}\n.intro .gx{transform-box:fill-box;transform-origin:0 50%;animation:gx .7s cubic-bezier(.2,.8,.2,1) both}\n.intro polygon.band{animation:lite .35s ease-out both}\n@media (prefers-reduced-motion: reduce){.intro *{animation:none!important}.card,.drawer,.tip,.cap{transition:none}}\n@media print{.ctl,.tip,.drawer,.cap{display:none!important}.card.dim{opacity:1;filter:none}}\n/* ===== dashboard 01 additions ===== */\n#bldg .fz *{pointer-events:none}\n#bldg .fz .rowbg{pointer-events:all}\n#bldg .fz.dim .rowbg{pointer-events:all}\n.dtab{display:grid;grid-template-columns:44px 1fr 1fr 58px 58px;gap:0 6px;font:500 11.5px \"IBM Plex Mono\",monospace;color:var(--ink2);line-height:1.9}\n.dtab .h{font-size:11px;color:var(--mute);letter-spacing:.6px;text-transform:uppercase}\n.dtab .sel{background:#FBF3DE}\n.dtab>div{text-align:right;padding:0 2px}.dtab>div:first-child{text-align:left}\n.dtab b{color:var(--ink)}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <header class=\"hdr\">\n    <span class=\"idx\">01<\/span>\n    <h1>Monitoring Monthly Electric Consumption<\/h1>\n    <div class=\"ctl\">\n      <button id=\"mPrev\" aria-label=\"Previous month\">◀<\/button><span class=\"mon num\" id=\"mLbl\"><\/span><button id=\"mNext\" aria-label=\"Next month\">▶<\/button>\n      <button id=\"mLatest\" title=\"Back to latest month\">Latest<\/button>\n      <button id=\"btnStory\" title=\"Presenter mode (P)\">▶ Present<\/button>\n      <span class=\"hint\">← → month · click floor<br>P present · Esc close<\/span>\n    <\/div>\n    <div class=\"meta\">Sri Ayudhaya Building (HO) · All floors G–18 + Driver Lounge EV<br><b id=\"hdrRange\">FY2026 data: April – September<\/b> · Unit: THB / kWh<\/div>\n  <\/header>\n  <div class=\"accent\"><\/div>\n\n  <\u0021-- ROW 1 : main chart -->\n  <section class=\"card\" id=\"cTrend\" style=\"left:24px;top:88px;width:1000px;height:500px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n      <div>\n        <div class=\"ttl\"><span class=\"dot\"><\/span>Comparing Electric Consumption · FY24 – FY26<\/div>\n        <div class=\"sub\">Monthly electricity cost (THB). Every FY26 month so far is higher than any month in the previous two years.<\/div>\n      <\/div>\n      <div class=\"legend\" style=\"flex:none;white-space:nowrap\">\n        <span class=\"lg\" id=\"trFlLg\" style=\"display:none;position:absolute;right:18px;top:40px;font-size:12px;color:var(--ink2)\"><i style=\"background:rgba(232,176,74,.35);border:1.5px solid var(--amber)\"><\/i><span id=\"trFlTx\"><\/span><\/span>\n        <span><i style=\"border-color:var(--fy24);border-top-style:dashed\"><\/i>FY2024<\/span>\n        <span><i style=\"border-color:var(--fy25)\"><\/i>FY2025<\/span>\n        <span><i style=\"border-color:var(--fy26);border-top-width:4px\"><\/i>FY2026<\/span>\n      <\/div>\n    <\/div>\n    <svg id=\"trend\" width=\"964\" height=\"420\" style=\"margin-top:6px\"><\/svg>\n  <\/section>\n\n  <\u0021-- ROW 1 : KPI -->\n  <section class=\"card\" id=\"cKPI\" style=\"left:1040px;top:88px;width:536px;height:238px\">\n    <div class=\"kpiHead\">\n      <div>\n        <div class=\"ttl\"><span class=\"dot\" style=\"background:var(--up)\"><\/span><span id=\"accTtl\">Accum. until Sep<\/span> · THB<\/div>\n        <div class=\"big num\" style=\"margin-top:10px\" id=\"kBig\"><\/div>\n      <\/div>\n      <span class=\"pill\" id=\"kPill\"><\/span>\n    <\/div>\n    <table class=\"acc\" id=\"accTbl\"><\/table>\n    <div class=\"sub\" id=\"kNote\" style=\"margin-top:10px\"><\/div>\n  <\/section>\n\n  <\u0021-- ROW 1 : cost bridge -->\n  <section class=\"card\" id=\"cWhy\" style=\"left:1040px;top:338px;width:536px;height:250px\">\n    <div class=\"ttl\"><span class=\"dot\" style=\"background:#E8B04A\"><\/span>Why cost rose · FY25 → FY26 (<span class=\"rng\">Apr–Sep<\/span>)<\/div>\n    <div class=\"sub\">Usage growth adds cost; a lower unit rate takes some back.<\/div>\n    <div style=\"display:flex;gap:14px;margin-top:2px\">\n      <svg id=\"bridge\" width=\"236\" height=\"116\"><\/svg>\n      <svg id=\"rate\" width=\"250\" height=\"116\"><\/svg>\n    <\/div>\n    <div class=\"minis\">\n      <div class=\"mini\"><div class=\"l\">Energy used (kWh)<\/div><div class=\"v num\" id=\"mKwh\"><\/div><\/div>\n      <div class=\"mini\"><div class=\"l\">Avg unit rate (THB/kWh)<\/div><div class=\"v num\" id=\"mRate\"><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <\u0021-- ROW 2 : building -->\n  <section class=\"card\" id=\"cBldg\" style=\"left:24px;top:602px;width:500px;height:360px\">\n    <div class=\"ttl\"><span class=\"dot\" style=\"background:var(--up)\"><\/span>Where the extra kWh comes from<\/div>\n    <div class=\"sub\">Bar = kWh FY26 vs FY25 (<span class=\"rng\">Apr–Sep<\/span>) · right column = selected month vs previous &nbsp;<span style=\"white-space:nowrap\"><i style=\"display:inline-block;width:9px;height:9px;background:var(--down);border-radius:2px\"><\/i> less &nbsp;<i style=\"display:inline-block;width:9px;height:9px;background:#D9CFC0;border- r:var(--mute);display:flex;justify-content:space-between;gap:20px}\n.foot b{color:var(--ink2);font-weight:600}\nsvg text{font-family:\"IBM Plex Sans\",sans-serif}\nsvg text.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}\n.lgF{display:none;align-items:center;gap:5px;color:#8A6D1F;font-weight:600}\n.lgF i{width:11px!important;height:11px!important;border:1.5px solid var(--amber)!important;background:rgba(232,176,74,.4);border-radius:2px;margin:0!important}\n\n/* ===== GA INTERACT KIT · styles (reusable) ===== */\n.hdr .meta{margin-left:18px}\n.ctl{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#C9D3E3}\n.ctl button{font:600 12px \"IBM Plex Sans\",sans-serif;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:4px;height:28px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}\n.ctl button:hover{background:rgba(255,255,255,.18)}\n.ctl button:focus-visible,.hit:focus-visible{outline:2px solid #E8B04A;outline-offset:2px}\n.ctl .mon{font:600 13px \"IBM Plex Mono\",monospace;color:#fff;min-width:64px;text-align:center}\n.ctl .mon.past{color:#E8B04A}\n.ctl .hint{font-size:11px;color:#8FA0BC;margin-left:6px;line-height:1.25}\n.card{transition:opacity .35s,filter .35s,box-shadow .35s,transform .35s}\n.card.dim{opacity:.16;filter:grayscale(.8)}\n.card.spot{box-shadow:0 0 0 3px var(--amber),0 12px 30px rgba(19,41,75,.18);z-index:5}\n.hit{cursor:pointer}\n#bldg .fz{transition:opacity .25s}\n#bldg .fz:focus{outline:none}\n#bldg .fz:focus-visible .rowbg{stroke:var(--amber);stroke-width:2}\n#bldg .fz text,#bldg .fz path,#bldg .fz circle{pointer-events:none}\n#bldg .fz.dim{opacity:.18}\n#bldg .fz.on .rowbg{fill:#F4EFE4}\n#bldg polygon.band{transition:opacity .25s,filter .25s}\n#bldg polygon.band.dim{opacity:.12}\n#bldg polygon.band.on{filter:drop-shadow(0 0 5px #FFD27A) brightness(1.08)}\n.tip{position:absolute;z-index:50;pointer-events:none;background:#f es rise{from{opacity:0;transform:translateY(10px)}}\n@keyframes gy{from{transform:scaleY(0)}}\n@keyframes gx{from{transform:scaleX(0)}}\n@keyframes lite{from{opacity:0}}\n.intro .card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}\n.intro .gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .7s cubic-bezier(.2,.8,.2,1) both}\n.intro .gx{transform-box:fill-box;transform-origin:0 50%;animation:gx .7s cubic-bezier(.2,.8,.2,1) both}\n.intro polygon.band{animation:lite .35s ease-out both}\n@media (prefers-reduced-motion: reduce){.intro *{animation:none!important}.card,.drawer,.tip,.cap{transition:none}}\n@media print{.ctl,.tip,.drawer,.cap{display:none!important}.card.dim{opacity:1;filter:none}}\n/* 02 · this-month KPI */\n.where{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:nowrap;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden}\n.fchip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1.5px solid var(--amber);background:#FBF0D6;border-radius:12px;font:600 12px \"IBM Plex Mono\",monospace;color:var(--ink);white-space:nowrap}\n.fchip b{color:var(--up)}\n.fchip.on{background:var(--amber)}\n.fchip:focus{outline:none}.fchip:focus-visible{outline:2px solid var(--navy);outline-offset:1px}\n.accRow{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:7px;border-top:2px solid var(--ink)}\n#cKPI table.acc{margin-top:2px;font-size:13px}\n#cKPI table.acc td{padding:2px 0}\n/* 02 overrides: drawer covers column 3 */\n.drawer{top:140px;width:520px;height:822px}\n#rpDots .hit:focus{outline:none}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\" id=\"stage\">\n\n  <header class=\"hdr\">\n    <span class=\"idx\">02<\/span>\n    <h1>Monitoring After-Hours Building Irregularities<\/h1>\n    <div class=\"ctl\">\n      <button id=\"mPrev\" aria-label=\"Previous month\">◀<\/button><span class=\"mon num\" id=\"mLbl\"><\/span><button id=\"mNext\" aria-label=\"Next month\">▶<\/button>\n      <button id=\"mLatest\" title=\"Back to latest month\">Latest<\/button>\n      <button id=\"btnStory\" title=\"Presenter mode (P)\">▶ Present<\/button>\n      <span class=\"hint\">← → month · click floor<br>P present · Esc close<\/span>\n    <\/div>\n    <div class=\"meta\">Sri Ayudhaya Building (HO) · Floors 2–18 · SRE night patrol<br><b id=\"hdrRange\">FY2026 data: April – September<\/b> · Unit: cases<\/div>\n  <\/header>\n  <div class=\"accent\"><\/div>\n\n  <\u0021-- ===== STORY COLUMN HEADS ===== -->\n  <div class=\"step\" style=\"left:24px;width:500px\"><span class=\"n\">1<\/span><span class=\"q\">How many?<\/span><span class=\"a\" id=\"a1\"><\/span><\/div>\n  <svg class=\"flow\" style=\"left:526px\" viewBox=\"0 0 16 16\"><path d=\"M4 2 L11 8 L4 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>\n  <div class=\"step\" style=\"left:544px;width:492px\"><span class=\"n\">2<\/span><span class=\"q\">Where &amp; when?<\/span><span class=\"a\" id=\"a2\"><\/span><\/div>\n  <svg class=\"flow\" style=\"left:1038px\" viewBox=\"0 0 16 16\"><path d=\"M4 2 L11 8 L4 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>\n  <div class=\"step\" style=\"left:1056px;width:520px\"><span class=\"n\">3<\/span><span class=\"q\">Why &amp; what next?<\/span><span class=\"a\" id=\"a3\"><\/span><\/div>\n\n  <\u0021-- ===== COLUMN 1 · HOW MANY ===== -->\n  <section class=\"card\" id=\"cKPI\" style=\"left:24px;top:140px;width:500px;height:258px\">\n    <div class=\"kpiHead\">\n      <div>\n        <div class=\"ttl\"><span class=\"dot\" style=\"background:var(--up)\"><\/span><span id=\"lmTtl\">This month · Sep<\/span> · new cases<\/div>\n        <div class=\"big num\" style=\"margin-top:8px\" id=\"kLM\"><\/div>\n      <\/div>\n      <div style=\"text-align:right\"><span class=\"pill\" id=\"kPill\"><\/span><div class=\"sub num\" id=\"kVs25\" style=\"margin-top:6px\"><\/div><\/div>\n    <\/div>\n    <div class=\"where\" id=\"kWhere\"><\/div>\n    <div class=\"accRow\"><span class=\"ttl\" style=\"font-size:12px\"><span id=\"accTtl\">Accum.<\/span><span id=\"kNote\" style=\"font-family:'IBM Plex Mono',monospace;letter-spacing:0;text-transform:none;font-weight:500;color:var(--mute);font-size:11.5px\"><\/span><\/span><span class=\"num\" style=\"font-size:24px;font-weight:600\" id=\"kBig\"><\/span><\/div>\n    <table class=\"acc\" id=\"accTbl\"><\/table>\n  <\/section>\n\n  <section class=\"card\" id=\"cTrend\" style=\"left:24px;top:410px;width:500px;height:552px\">\n    <div class=\"ttl\"><span class=\"dot\"><\/span>Running total · FY24 – FY26<\/div>\n    <div class=\"sub\" id=\"trendSub\"><\/div>\n    <div class=\"legend\">\n      <span><i style=\"border-color:var(--fy24);border-top-style:dashed\"><\/i>FY24<\/span>\n      <span><i style=\"border-color:var(--fy25)\"><\/i>FY25<\/span>\n      <span><i style=\"border-color:var(--fy26);border-top-width:4px\"><\/i>FY26<\/span>\n      <span><i class=\"sq\"><\/i>FY26 per month<\/span>\n      <span class=\"lgF\" id=\"trFlLg\"><i><\/i><span id=\"trFlTx\"><\/span><\/span>\n    <\/div>\n    <svg id=\"trend\" width=\"464\" height=\"460\" style=\"margin-top:4px\"><\/svg>\n  <\/section>\n\n  <\u0021-- ===== COLUMN 2 · WHERE & WHEN ===== -->\n  <section class=\"card\" id=\"cBldg\" style=\"left:544px;top:140px;width:492px;height:472px\">\n    <div class=\"ttl\"><span class=\"dot\" style=\"background:var(--up)\"><\/span>Cases by floor · FY26 (<span id=\"rngB\">Apr–Sep<\/span>)<\/div>\n    <div class=\"sub\">Bar = FY26 · <span style=\"color:var(--fy25);font-weight:600\">┃<\/span> FY25 same months · <i style=\"display:inline-block;width:11px;height:9px;border:2px solid var(--amber);border-radius:2px;vertical-align:-1px\"><\/i> <b style=\"color:#8A6D1F\" id=\"newB\">new in Sep<\/b> · right = month vs previous<\/div>\n    <div class=\"sub\" style=\"margin-top:4px\"><span style=\"white-space:nowrap\"><i style=\"display:inline-block;width:9px;height:9px;background:#ECE7DD;border:1px solid #D9CFC0;border-radius:2px\"><\/i> 0 &nbsp;<i style=\"display:inline-block;width:9px;height:9px;background:#D9CFC0;border-radius:2px\"><\/i> 1 &nbsp;<i style=\"display:inline-block;width:9px;height:9px;background:#E8B04A;border-radius:2px\"><\/i> 2 &nbsp;<i style=\"display:inline-block;width:9px;height:9px;background:#D9673E;border-radius:2px\"><\/i> 3–4 &nbsp;<i style=\"display:inline-block;width:9px;height:9px;background:var(--up);border-radius:2px\"><\/i> ≥5 cases<\/span><\/div>\n    <svg id=\"bldg\" width=\"456\" height=\"384\" style=\"margin-top:4px\"><\/svg>\n  <\/section>\n\n  <section class=\"card\" id=\"cTime\" style=\"left:544px;top:624px;width:492px;height:338px\">\n    <div class=\"ttl\"><span class=\"dot\" style=\"background:#E8B04A\"><\/span>When it is found<\/div>\n    <div class=\"sub\" id=\"timeSub\"><\/div>\n    <svg id=\"clock\" width=\"456\" height=\"180\" style=\"margin-top:6px\"><\/svg>\n    <svg id=\"wday\" width=\"456\" height=\"64\" style=\"margin-top:4px\"><\/svg>\n  <\/section>\n\n  <\u0021-- ===== COLUMN 3 · WHY & WHAT NEXT ===== -->\n  <section class=\"card why\" id=\"cWhy\" style=\"left:1056px;top:140px;width:520px;height:274px\">\n    <div class=\"ttl\" style=\"width:100%\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M3 18V9l7-6 7 6v9z\" fill=\"none\" stroke=\"var(--navy)\" stroke-width=\"1.6\"/><rect x=\"7\" y=\"10\" width=\"2\" height=\"6\" fill=\"var(--fy25)\"/><rect x=\"9.5\" y=\"8\" width=\"2\" height=\"8\" fill=\"#E8B04A\"/><rect x=\"12\" y=\"6\" width=\"2\" height=\"10\" fill=\"var(--up)\"/><\/svg>\n      Factors <span class=\"hl\">▲<\/span> cases\n      <span class=\"draft\">Draft<\/span>\n    <\/div>\n    <ol>\n      <li><span class=\"hl\">▲<\/span> Last person out leaves without a switch check\n        <div class=\"trk\"><span class=\"t\"><i id=\"b1\" style=\"background:var(--up)\"><\/i><\/span><b id=\"v1\"><\/b><\/div><\/li>\n      <li><span class=\"hl\">▲<\/span> Floors with 3+ cases · <span class=\"hl\" id=\"fAreas\"><\/span>\n        <div class=\"trk\"><span class=\"t\"><i id=\"b2\" style=\"background:#D9673E\"><\/i><\/span><b id=\"v2\"><\/b><\/div><\/li>\n      <li>Housekeeping leaves area without checking switches\n        <div class=\"trk\"><span class=\"t\"><i id=\"b3\" style=\"background:#E8B04A\"><\/i><\/span><b id=\"v3\"><\/b><\/div><\/li>\n    <\/ol>\n    <div class=\"sub\" id=\"whyNote\" style=\"margin-top:2px\"><\/div>\n  <\/section>\n\n  <section class=\"card\" id=\"cLoop\" style=\"left:1056px;top:426px;width:520px;height:170px\">\n    <div class=\"ttl\"><span class=\"dot\" style=\"background:var(--leaf)\"><\/span>Closing the loop · owner notified<\/div>\n    <div class=\"sub\" id=\"fuSub\"><\/div>\n    <div class=\"stk\" id=\"stk\"><\/div>\n    <div class=\"stkL\" id=\"stkL\"><\/div>\n    <div class=\"chain\"><span class=\"c\">SRE patrol report<\/span>→<span class=\"c\">GA CCTV check<\/span>→<span class=\"c\">Owner notified<\/span><\/div>\n  <\/section>\n\n  <section class=\"card\" id=\"cRep\" style=\"left:1056px;top:608px;width:520px;height:108px;padding:12px 18px\">\n    <div class=\"ttl\"><span class=\"dot\" style=\"background:var(--navy)\"><\/span>Same person again?<\/div>\n    <div style=\"display:flex;align-items:center;gap:16px;margin-top:4px\">\n      <div style=\"flex:none;width:118px\"><div class=\"num\" style=\"font-size:34px;font-weight:600;line-height:1\" id=\"rpBig\"><\/div><div class=\"sub\" style=\"margin-top:3px\" id=\"rpLbl\"><\/div><\/div>\n      <div style=\"flex:1\"><svg id=\"rpDots\" width=\"350\" height=\"22\"><\/svg><div class=\"sub\" id=\"rpNote\" style=\"margin-top:3px;line-height:1.25\"><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\" id=\"cIns\" style=\"left:1056px;top:728px;width:520px;height:234px;padding:12px 18px\">\n    <div class=\"ttl\"><span class=\"dot\" style=\"background:#E8B04A\"><\/span>Key insights<\/div>\n    <ul class=\"ins\" id=\"ins\"><\/ul>\n  <\/section>\n\n  <aside class=\"drawer\" id=\"drawer\" aria-hidden=\"true\"><button class=\"x\" id=\"dClose\" aria-label=\"Close\">×<\/button><div id=\"dBody\"><\/div><\/aside>\n  <div class=\"tip\" id=\"tip\"><\/div>\n  <div class=\"cap\" id=\"cap\"><\/div>\n\n  <div class=\"foot\">\n    <span><b>Prepared by:<\/b> SEKSON NILERTRAM * WORKPLACE AND INFRASTRUCTURE MANAGEMENT SECTION<\/span>\n    <span id=\"stamp\"><\/span>\n  <\/div>\n<\/div>\n\n<script>\n/* ====== DATA (from Excel \"แบบบันทึกรายงาน FY2026\") ======\n   To add a month: append its cases to E, then raise UNTIL by 1 (a month with zero cases still counts as reported).\n   E row = [date, floor, time \"HH:MM\" or null, type, cause, follow-up]\n     type  : L lights not off · A AC not off · D door not closed · O others\n     cause : S staff (last person out) · H housekeeping · C CCTV gap / unverified\n     follow: Y owner notified (verbal / email / housekeeping supervisor / vendor) · N \"not yet notified\" · - nothing recorded\n     person: anonymised code of who left it on (from Excel col J \"หน่วยงาน/ผู้เกี่ยวข้อง\"); same code = same person ·\n             \"HK\" = housekeeping team · \"P18+P19\" = two people · null = not recorded. Names are kept in Excel only.\n     Note: all FY26 cases set to Y per GA confirmation (1 Oct 2026) — Excel col K still shows 9 \"ยังไม่ได้แจ้ง\" + 5 blank. */\nconst M=[\"Apr.\",\"May.\",\"Jun.\",\"Jul.\",\"Aug.\",\"Sept.\",\"Oct.\",\"Nov.\",\"Dec.\",\"Jan.\",\"Feb.\",\"Mar.\"];\nconst MF=[\"April\",\"May\",\"June\",\"July\",\"August\",\"September\",\"October\",\"November\",\"December\",\"January\",\"February\",\"March\"];\nconst UNTIL=6; /* FY26 months reported: Apr–Sep (last record 22 Sep 2026) */\nconst E=[\n [\"2026-04-29\",\"14\",\"18:32\",\"L\",\"S\",\"Y\",\"P01\"],\n [\"2026-05-07\",\"16\",\"21:26\",\"L\",\"S\",\"Y\",null],\n [\"2026-05-19\",\"17\",\"19:00\",\"L\",\"C\",\"Y\",null],\n [\"2026-05-22\",\"8\",\"18:00\",\"L\",\"H\",\"Y\",\"HK\"],\n [\"2026-05-28\",\"9\",\"18:07\",\"L\",\"S\",\"Y\",\"P02\"],\n [\"2026-06-02\",\"15\",\"19:08\",\"L\",\"S\",\"Y\",\"P03\"],\n [\"2026-06-05\",\"5\",\"19:52\",\"L\",\"S\",\"Y\",\"P04\"],\n [\"2026-06-10\",\"8\",\"20:33\",\"L\",\"S\",\"Y\",\"P05\"],\n [\"2026-06-10\",\"9\",\"19:03\",\"L\",\"S\",\"Y\",\"P06\"],\n [\"2026-06-13\",\"3\",\"17:33\",\"L\",\"S\",\"Y\",\"P07\"],\n [\"2026-06-15\",\"2\",null,\"A\",\"S\",\"Y\",\"P08\"],\n [\"2026-06-22\",\"10\",\"20:44\",\"L\",\"S\",\"Y\",\"P09\"],\n [\"2026-06-22\",\"8\",\"19:48\",\"L\",\"S\",\"Y\",\"P10\"],\n [\"2026-07-03\",\"18\",\"21:23\",\"L\",\"S\",\"Y\",\"P11\"],\n [\"2026-07-03\",\"17\",\"22:43\",\"L\",\"S\",\"Y\",\"P12\"],\n [\"2026-07-18\",\"9\",\"19:42\",\"L\",\"S\",\"Y\",\"P13\"],\n [\"2026-07-18\",\"2\",\"18:49\",\"L\",\"S\",\"Y\",\"P14\"],\n [\"2026-07-20\",\"16\",\"21:50\",\"L\",\"S\",\"Y\",\"P15\"],\n [\"2026-07-22\",\"14\",\"21:48\",\"L\",\"S\",\"Y\",\"P16\"],\n [\"2026-07-26\",\"8\",\"15:03\",\"L\",\"H\",\"Y\",\"HK\"],\n [\"2026-07-30\",\"16\",\"11:24\",\"L\",\"H\",\"Y\",\"HK\"],\n [\"2026-08-09\",\"16\",\"10:18\",\"L\",\"S\",\"Y\",\"P17\"],\n [\"2026-08-11\",\"12\",\"17:58\",\"L\",\"H\",\"Y\",\"HK\"],\n [\"2026-08-14\",\"16\",\"21:55\",\"L\",\"S\",\"Y\",\"P18+P19\"],\n [\"2026-08-25\",\"17\",null,\"L\",\"S\",\"Y\",\"P20\"],\n [\"2026-09-07\",\"16\",\"23:35\",\"L\",\"S\",\"Y\",\"P21\"],\n [\"2026-09-08\",\"2\",\"16:34\",\"L\",\"S\",\"Y\",\"P08\"],\n [\"2026-09-22\",\"16\",\"21:02\",\"L\",\"S\",\"Y\",\"P21\"]\n];\n/* office floors in scope (top → bottom) */\nconst FL=[\"18\",\"17\",\"16\",\"15\",\"14\",\"12\",\"11\",\"10\",\"9\",\"8\",\"7\",\"5\",\"4\",\"3\",\"2\"];\n/* FY2025 (Apr 2025 – Mar 2026) floor × month, from FY25 summary table (update until 25/3/26) */\nconst P25=[{5:2,8:1,11:2,16:1},{4:1,9:2,15:1},{8:1,14:1},{16:1},{9:2,16:2},{3:1,8:1,12:1,14:1},{15:1,16:3},{},{16:1},{4:1,16:1},{2:1,3:1,5:2,8:1,11:1,14:1,16:2},{16:1}];\n/* FY2024 (Apr 2024 – Mar 2025), from archive sheet \"รายงานความไม่เรียบร้อย_5\" — March not recorded (null) */\nconst P24=[{9:1,14:1,16:2},{7:1,8:3,9:1,11:1,14:1,16:3},{8:1,12:1,15:1,16:1},{5:1,9:1,16:2},{2:1,16:3},{9:1,16:1},{},{},{16:1},{5:1,8:1,16:1},{8:6,16:2},null];\n\n\n/* =====================================================================\n   GA INTERACT KIT — reusable across the dashboard series\n   Kit.set(key,val) / Kit.on(fn)  : shared state (\"m\" = month index, \"floor\" = hovered/pinned area)\n   Kit.tip(el, ()=>html)          : rich tooltip (hover + keyboard focus)\n   Kit.count(el, to, fmt)         : count-up number\n   Kit.drawer.open(html) / close  : slide-in detail panel\n   Kit.story(steps)               : presenter mode — steps = [{cards:[ids], cap:()=>html, enter:()=>{}}]\n   ===================================================================== */\nconst Kit=(()=>{\n const stage=document.getElementById(\"stage\"), st={}, subs=[];\n const RM=matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n const set=(k,v)=>{if(st[k]===v)return;st[k]=v;subs.forEach(f=>f(k,v,st))};\n const on=f=>subs.push(f);\n /* tooltip (positioned in stage coordinates, flips at edges) */\n const tipEl=document.getElementById(\"tip\");\n const toStage=(cx,cy)=>{const r=stage.getBoundingClientRect(),k=r.width/1600;return [(cx-r.left)/k,(cy-r.top)/k]};\n const place=(x,y)=>{const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let px=x+16,py=y+16;if(px+w>1590)px=x-w-16;if(py+h>990)py=y-h-16;tipEl.style.left=px+\"px\";tipEl.style.top=py+\"px\"};\n const tip=(el,html)=>{\n  el.addEventListener(\"mouseenter\",e=>{tipEl.innerHTML=html();tipEl.classList.add(\"on\");place(...toStage(e.clientX,e.clientY))});\n  el.addEventListener(\"mousemove\",e=>place(...toStage(e.clientX,e.clientY)));\n  el.addEventListener(\"mouseleave\",()=>tipEl.classList.remove(\"on\"));\n  el.addEventListener(\"focus\",()=>{const b=el.getBoundingClientRect();tipEl.innerHTML=html();tipEl.classList.add(\"on\");place(...toStage(b.right,b.top))});\n  el.addEventListener(\"blur\",()=>tipEl.classList.remove(\"on\"));\n };\n const hideTip=()=>tipEl.classList.remove(\"on\");\n /* count-up */\n const count=(el,to,f,ms=900)=>{if(RM){el.textContent=f(to);return}const t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)};\n /* drawer */\n const dEl=document.getElementById(\"drawer\"),dBody=document.getElementById(\"dBody\");\n const drawer={open:h=>{dBody.innerHTML=h;dEl.classList.add(\"open\");dEl.setAttribute(\"aria-hidden\",\"false\")},close:()=>{dEl.classList.remove(\"open\");dEl.setAttribute(\"aria-hidden\",\"true\");set(\"pin\",null)},isOpen:()=>dEl.classList.contains(\"open\")};\n document.getElementById(\"dClose\").addEventListener(\"click\",drawer.close);\n /* presenter / story mode */\n const capEl=document.getElementById(\"cap\");\n const story=steps=>{\n  let i=-1;\n  const cards=[...stage.querySelectorAll(\".card\")];\n  const show=()=>{\n   const s=steps[i];hideTip();\n   cards.forEach(c=>{const on=s.cards.includes(c.id);c.classList.toggle(\"dim\",!on);c.classList.toggle(\"spot\",on)});\n   if(s.enter)s.enter();\n   capEl.innerHTML=`<span class=\"k\">${i+1} / ${steps.length}<\/span><span>${s.cap()}<\/span><span class=\"h\">← → · Esc<\/span>`;capEl.classList.add(\"on\");\n  };\n  const stop=()=>{if(i<0)return;i=-1;cards.forEach(c=>c.classList.remove(\"dim\",\"spot\"));capEl.classList.remove(\"on\");steps.forEach(s=>s.leave&&s.leave())};\n  return {active:()=>i>=0,start:()=>{drawer.close();i=0;show()},stop,next:()=>{if(i<steps.length-1){i++;show()}else stop()},prev:()=>{if(i>0){i--;show()}}};\n };\n return {st,set,on,tip,hideTip,count,drawer,story,RM};\n})();\n\n/* ====== helpers ====== */\nconst NS=\"http://www.w3.org/2000/svg\";\nconst el=(p,t,a={},txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e};\nconst $=id=>document.getElementById(id);\nconst fmt=n=>Math.round(n).toLocaleString(\"en-US\");\nconst pct=(a,b)=>(a/b-1)*100;\nconst sum=(a,n)=>a.slice(0,n).reduce((s,x)=>s+(x||0),0);\nconst nm=f=>f+\"F\";\nconst mi=d=>{const m=+d.slice(5,7);return (m+8)%12}; /* Apr=0 … Mar=11 */\nconst MS=i=>M[i].replace(\".\",\"\");\nconst N=UNTIL, LM=MS(N-1), PM=MS(N-2);\nconst RNG=\"Apr–\"+LM;\nconst tot=o=>o==null?null:Object.values(o).reduce((s,x)=>s+x,0);\nconst m26=Array.from({length:N},(_,i)=>E.filter(e=>mi(e[0])===i).length);\nconst m25=P25.map(tot), m24=P24.map(tot);\nconst cum=a=>{let s=0;return a.map(v=>v==null?null:(s+=v))};\nconst c26=cum(m26),c25=cum(m25),c24=cum(m24);\nconst Y26=sum(m26,N),Y25=sum(m25,N),Y24=sum(m24,N),F25=sum(m25,12);\nconst EL=L=>E.filter(e=>mi(e[0])<=L);                       /* FY26 events Apr–L */\nconst fl26=(f,L=N-1)=>EL(L).filter(e=>e[1]===f).length;\nconst fl25=(f,n)=>P25.slice(0,n).reduce((s,o)=>s+(o[f]||0),0);\nconst flM=(f,i)=>i<0?0:E.filter(e=>e[1]===f&&mi(e[0])===i).length;\nconst cnt=(k,v,L=N-1)=>EL(L).filter(e=>e[k]===v).length;\nconst dY=pct(Y26,Y25);\nconst rankF=L=>FL.map(f=>({f,a:fl26(f,L)})).filter(x=>x.a>0).sort((a,b)=>b.a-a.a||(+b.f)-(+a.f));\nconst REPEAT_MIN=3; /* factor 2 threshold: floors with 3+ cases (Apr → selected month) */\nconst topOf=L=>rankF(L).filter(x=>x.a>=REPEAT_MIN);\nconst rk=rankF(N-1), topF=topOf(N-1), topSum=topF.reduce((s,x)=>s+x.a,0);\nconst tm=E.filter(e=>e[2]).map(e=>+e[2].slice(0,2)), after=tm.filter(t=>t>=18).length;\nconst nY=cnt(5,\"Y\"),nN=cnt(5,\"N\"),nZ=cnt(5,\"-\");\nconst TYPE={L:\"Lights not off\",A:\"AC not off\",D:\"Door not closed\",O:\"Other\"};\nconst CAUSE={S:\"Staff · last person out\",H:\"Housekeeping\",C:\"CCTV gap / unverified\"};\nconst FOLLOW={Y:\"Owner notified\",N:\"Not yet notified\",\"-\":\"No record\"};\n/* mini column sparkline (counts): rows = values per month, sel = highlighted month */\nconst spark=(rows,sel,w=150,h=30,col=\"#13294B\")=>{const mx=Math.max(1,...rows),bw=w/12-3;let s=`<svg width=\"${w}\" height=\"${h+14}\" style=\"display:block;margin:4px 0 2px\">`;\n rows.forEach((v,i)=>{const x=i*(w/12)+1.5,hh=v/mx*h,op=i===sel?1:.5;s+=`<rect x=\"${x}\" y=\"${h-hh}\" width=\"${bw}\" height=\"${Math.max(hh,v?1.5:0)}\" fill=\"${col}\" opacity=\"${op}\"/>`;\n  if(v)s+=`<text x=\"${x+bw/2}\" y=\"${h-hh-2}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#4A5263\">${v}<\/text>`;\n  s+=`<text x=\"${x+bw/2}\" y=\"${h+12}\" text-anchor=\"middle\" font-size=\"11\" fill=\"${i===sel?\"#1B2230\":\"#8A8F98\"}\" font-weight=\"${i===sel?600:400}\">${M[i][0]}<\/text>`});\n for(let i=rows.length;i<12;i++){const x=i*(w/12)+1.5;s+=`<rect x=\"${x}\" y=\"${h-2}\" width=\"${bw}\" height=\"2\" fill=\"#E4E8EE\"/><text x=\"${x+bw/2}\" y=\"${h+12}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#B9B2A6\">${M[i][0]}<\/text>`}\n return s+\"<\/svg>\"};\nconst flRows=f=>Array.from({length:N},(_,i)=>flM(f,i));\nconst dlt=d=>d>0?`<span style=\"color:var(--up)\">+${d}<\/span>`:d<0?`<span style=\"color:var(--down)\">−${-d}<\/span>`:`<span style=\"color:var(--mute)\">±0<\/span>`;\nconst FIRST={kpi:true,bldg:true};\n\n$(\"hdrRange\").textContent=\"FY2026 data: April – \"+MF[N-1];\n\n/* ====== column-head answers (2 & 3 = to date) ====== */\n$(\"a2\").innerHTML=`<b>${nm(rk[0].f)}<\/b> top floor · <b>${(after/tm.length*100).toFixed(0)}%<\/b> after 18:00`;\n$(\"a3\").innerHTML=`<b class=\"${nY===Y26?\"dn\":\"\"}\">${(nY/Y26*100).toFixed(0)}%<\/b> reached the owner`;\n\n/* ====== KPI (follows selected month: Apr → selected) ====== */\nfunction renderKPI(L){\n const n=m26[L],pv=L>0?m26[L-1]:null,a=c26[L],b=c25[L],c=c24[L],d=pct(a,b);\n $(\"lmTtl\").textContent=(L===N-1?\"This month · \":\"Selected · \")+MS(L);\n if(FIRST.kpi&&!Kit.RM){$(\"kLM\").innerHTML='+<span id=\"kLMn\"><\/span><small>cases<\/small>';Kit.count($(\"kLMn\"),n,fmt,700)}else $(\"kLM\").innerHTML=\"+\"+fmt(n)+\"<small>cases<\/small>\";\n const pl=$(\"kPill\");\n if(pv!=null){const t=n-pv;pl.classList.toggle(\"dn\",t<=0);pl.textContent=(t>0?\"▲ \":t<0?\"▼ \":\"= \")+(t?Math.abs <script type="application/json" id="d03">"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Waste &amp; Recyclables Monitor<\/title>\n<\u0021--GA_FONTS-->\n<style>\n:root{\n  --paper:#F3F0E9; --card:#FFFFFF; --ink:#1B2230; --ink2:#4A5263; --mute:#8A8F98; --line:#E3DED3;\n  --navy:#13294B; --fy26:#13294B; --fy25:#6F8F72; --fy24:#C79B6B;\n  --up:#B8322A; --upSoft:#F4DDD9; --down:#2F6E95; --downSoft:#DCE8F0; --plot:#EEF1F5; --leaf:#4E7A4C; --amber:#E8B04A;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:#2A2F38;overflow:hidden}\nbody{font-family:\"IBM Plex Sans\",system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}\n.stage{width:1600px;height:1000px;background:var(--paper);position:relative;transform-origin:center center;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.35)}\n.num{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-feature-settings:\"tnum\"}\n/* header */\n.hdr{position:absolute;left:0;top:0;width:100%;height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 28px;gap:18px}\n.hdr .idx{font-family:\"IBM Plex Mono\";font-size:15px;border:1px solid rgba(255,255,255,.4);padding:3px 9px;border-radius:3px}\n.hdr h1{font-weight:600;font-size:24px;letter-spacing:.2px}\n.hdr .meta{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.45;color:#C9D3E3}\n.hdr .meta b{color:#fff;font-weight:600}\n.accent{position:absolute;top:64px;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--up) 0 22%,#E8B04A 22% 30%,var(--fy25) 30% 100%)}\n/* cards */\n.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px}\n.ttl{font-family:\"IBM Plex Sans Condensed\",\"Arial Narrow\",\"IBM Plex Sans\",system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;col :#fff;min-width:64px;text-align:center}\n.ctl .mon.past{color:#E8B04A}\n.ctl .hint{font-size:11px;color:#8FA0BC;margin-left:6px;line-height:1.25}\n.card{transition:opacity .35s,filter .35s,box-shadow .35s,transform .35s}\n.card.dim{opacity:.16;filter:grayscale(.8)}\n.card.spot{box-shadow:0 0 0 3px var(--amber),0 12px 30px rgba(19,41,75,.18);z-index:5}\n.hit{cursor:pointer}\n#bldg .fz{transition:opacity .25s}\n#bldg .fz:focus{outline:none}\n#bldg .fz:focus-visible .rowbg{stroke:var(--amber);stroke-width:2}\n#bldg .fz text,#bldg .fz path,#bldg .fz circle{pointer-events:none}\n#bldg .fz.dim{opacity:.18}\n#bldg .fz.on .rowbg{fill:#F4EFE4}\n#bldg polygon.band{transition:opacity .25s,filter .25s}\n#bldg polygon.band.dim{opacity:.12}\n#bldg polygon.band.on{filter:drop-shadow(0 0 5px #FFD27A) brightness(1.08)}\n.tip{position:absolute;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(19,41,75,.22);padding:10px 12px;font-size:12px;color:var(--ink2);min-width:180px;max-width:280px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}\n.tip.on{opacity:1;transform:none}\n.tip h4{font:600 12.5px \"IBM Plex Sans\",sans-serif;color:var(--ink);margin-bottom:4px}\n.tip .r{display:flex;justify-content:space-between;gap:14px;font-family:\"IBM Plex Mono\",monospace;font-size:11.5px;line-height:1.55}\n.tip .r b{color:var(--ink)}\n.tip .n{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.35}\n.drawer{position:absolute;top:84px;right:24px;width:384px;height:878px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:-14px 0 40px rgba(19,41,75,.18);z-index:30;padding:16px 18px;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:hidden}\n.drawer.open{transform:none}\n.drawer .x{position:absolute;right:12px;top:10px;width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:16px;color: der-top:0}\n.ins li b{color:var(--ink);font-weight:600}\n.ins .ic{width:26px;height:26px}\n.lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}\n.lg i{display:inline-block;width:9px;height:9px;border-radius:2px}\n.foot{position:absolute;left:24px;right:24px;bottom:10px;font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between;gap:20px}\n.foot b{color:var(--ink2);font-weight:600}\nsvg text{font-family:\"IBM Plex Sans\",sans-serif}\nsvg text.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}\n\n/* ===== GA INTERACT KIT · styles (reusable) ===== */\n.hdr .meta{margin-left:18px}\n.ctl{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#C9D3E3}\n.ctl button{font:600 12px \"IBM Plex Sans\",sans-serif;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:4px;height:28px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}\n.ctl button:hover{background:rgba(255,255,255,.18)}\n.ctl button:focus-visible,.hit:focus-visible{outline:2px solid #E8B04A;outline-offset:2px}\n.ctl .mon{font:600 13px \"IBM Plex Mono\",monospace;color:#fff;min-width:64px;text-align:center}\n.ctl .mon.past{color:#E8B04A}\n.ctl .hint{font-size:11px;color:#8FA0BC;margin-left:6px;line-height:1.25}\n.card{transition:opacity .35s,filter .35s,box-shadow .35s,transform .35s}\n.card.dim{opacity:.16;filter:grayscale(.8)}\n.card.spot{box-shadow:0 0 0 3px var(--amber),0 12px 30px rgba(19,41,75,.18);z-index:5}\n.hit{cursor:pointer}\n#bldg .fz{transition:opacity .25s}\n#bldg .fz:focus{outline:none}\n#bldg .fz:focus-visible .rowbg{stroke:var(--amber);stroke-width:2}\n#bldg .fz text,#bldg .fz path,#bldg .fz circle{pointer-events:none}\n#bldg .fz.dim{opacity:.18}\n#bldg .fz.on .rowbg{fill:#F4EFE4}\n#bldg polygon.band{transition:opacity .25s,filter .25s}\n#bldg polygon.band.dim{opacity:.12}\n#bldg polygon.band.on{filter:drop-shadow(0 0 5px #FFD27A) brightness(1.08) endor.`],\n  [\"#C79B6B\",\"M5 12h14M13 6l6 6-6 6\",`<b>Next: adjust NVR3 like NVR1<\/b> — model hits ${REQ} d in ≈${T3-LAT} days. Hold NVR2's +${f1(needTB(rateAct(1))-hddT(1))} TB HDD: adjusted load needs ${f1(needTB(R_NEW))} of ${f1(hddT(1))} TB.`]];\n $(\"ins\").innerHTML=I.map(([c,d,t],k)=>`<li id=\"ins${k}\"><svg class=\"ic\" viewBox=\"0 0 24 24\"><rect width=\"24\" height=\"24\" rx=\"5\" fill=\"${c}\" opacity=\".12\"/><path d=\"${d}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span>${t}<\/span><\/li>`).join(\"\");\n})();\n\n/* ====== DRAWER ====== */\nfunction openNvr(name){\n const i=NV.findIndex(n=>n.id===name),n=NV[i],d=Kit.st.d,days=i===1?retD(d):n.ret,gap=days-REQ;\n const MAXC=Math.max(...NV.map(x=>Math.max(...x.hdd)));\n const rate=rateAct(i),need=needTB(rate),fit=hddT(i);\n const gp=v=>v>0?`<b style=\"color:var(--up)\">+${f2(v)} TB short<\/b>`:`<b style=\"color:var(--down)\">${f2(-v)} TB spare<\/b>`;\n let eta=\"\";\n if(i===0)eta=`Benchmark — +${gap} d above requirement.`;\n if(i===1)eta=`Model: ${REQ} d on <b>${dstr(T2,1)}<\/b>${T2c!=null?` (or ${dstr(T2c,1)} if recording 24 h)`:\"\"}.`;\n if(i===2)eta=`What-if: adjust ${dstr(LAT)} → ${REQ} d by <b>${dstr(T3,1)}<\/b> (assumes NVR1's write rate per camera).`;\n const hdd=NV[i].hdd.map((c,k)=>`<div class=\"rw\"><span>HDD${k+1}<\/span><span style=\"flex:1;align-self:center\"><i style=\"display:block;height:7px;border-radius:2px;background:#13294B;width:${c/MAXC*100}%\"><\/i><\/span><b>${c} TB<\/b><\/div>`).join(\"\")+Array.from({length:BAYS-NV[i].hdd.length},(_,k)=>`<div class=\"rw\"><span>HDD${NV[i].hdd.length+k+1}<\/span><span style=\"flex:1;align-self:center\"><i style=\"display:block;height:7px;border-radius:2px;border:1px dashed #E8B04A\"><\/i><\/span><b style=\"color:#B98A1E\">free<\/b><\/div>`).join(\"\");\n let extra=\"\";\n if(i===1)extra=`<div class=\"rw\" style=\"margin-top:6px\"><span>After NVR1-like load<\/span><b>${fmt(R_NEW)} GB/d<\/b><\/div><div class=\"rw\"><span>Needed for ${REQ} d<\/span><b>${f2(needTB(R_NEW))} TB<\/b><\/div><div class=\"rw\"><span>vs fitted ${f2(fit)} TB<\/span>${gp(needTB(R_NEW)-fit)}<\/div>`;\n if(i===2)extra=`<div class=\"rw\" style=\"margin-top:6px\"><span>If adjusted (assumed)<\/span><b>${fmt(R3_NEW)} GB/d<\/b><\/div><div class=\"rw\"><span>Needed for ${REQ} d<\/span><b>${f2(needTB(R3_NEW))} TB<\/b><\/div><div class=\"rw\"><span>vs fitted ${f2(fit)} TB<\/span>${gp(needTB(R3_NEW)-fit)}<\/div>`;\n const topc=chs(i).slice().sort((a,b)=>kb(b)-kb(a)).slice(0,5),mx=kb(topc[0]);\n const tops=topc.map(c=>`<div class=\"rw\"><span>${c[1]} · ${resS(c[3])} · ${c[4]} fps<\/span><span style=\"flex:1;align-self:center\"><i style=\"display:block;height:6px;border-radius:2px;background:${kb(c)>3500?\"#B8322A\":\"#8FA6C8\"};width:${kb(c)/mx*100}%\"><\/i><\/span><b>${fmt(kb(c))}<\/b><\/div>`).join(\"\");\n const acts=ACT.filter(a=>a[0]===i).map(a=>`<div class=\"ac\"><i style=\"background:${a[1]<=2?\"#B8322A\":\"#D9673E\"}\">${a[1]}<\/i><div>${a[2]}<br><span class=\"pend\">OWNER TBD<\/span><span class=\"pend\">DATE TBD<\/span><span style=\"font-size:11px;color:var(--mute)\">${a[3]}<\/span><\/div><\/div>`).join(\"\")||`<div style=\"font-size:12.5px;color:var(--ink2);padding:4px 0\">No action needed — keep as the benchmark.<\/div>`;\n Kit.drawer.open(`<div class=\"ttl\"><span class=\"dot\"><\/span>${n.id} · detail<\/div>\n <div class=\"sub\" style=\"margin-bottom:8px\">${i===1?\"Day \"+d+\" · \"+dstr(d,1)+(d>LAT?\" · forecast\":\"\"):\"Reading \"+dstr(LAT,1)}<\/div>\n <div style=\"display:flex;align-items:flex-end;justify-content:space-between\"><div class=\"big num\">${days}<small>days<\/small><\/div><span class=\"pill ${gap>=0?\"dn\":\"\"}\">${gap>=0?\"▲\":\"▼\"} ${Math.abs(gap)} d vs ${REQ}<\/span><\/div>\n <div style=\"font-size:12.5px;color:var(--ink2);margin:8px 0 4px;line-height:1.4\">${eta}<\/div>\n <div class=\"dv\"><h5>HDD fitted <span>${NV[i].hdd.length} of ${BAYS} bays · ${f2(fit)} TB<\/span><\/h5>${hdd}<\/div>\n <div class=\"dv\"><h5>Storage for ${REQ} days <span>settings before adjust<\/span><\/h5><div class=\"rw\"><span>Writes<\/span><b>${fmt(rate)} GB/d<\/b><\/div><div class=\"rw\"><span>Needed<\/span><b>${f2(need)} TB<\/b><\/div><div class=\"rw\"><span>vs fitted ${f2(fit)} TB<\/span>${gp(need-fit)}<\/div>${extra}<\/div>\n <div class=\"dv\"><h5>Heaviest channels <span>kbps, general + sub<\/span><\/h5>${tops}<\/div>\n <div class=\"dv\"><h5>Action plan <span>sheet 4<\/span><\/h5>${acts}<div class=\"ac\" style=\"grid-template-columns:22px 1fr\"><i style=\"background:#4E7A4C\">5<\/i><div>System: confirm whether ${REQ} days is mandatory or an internal target<br><span class=\"pend\">OWNER TBD<\/span><span class=\"pend\">DATE TBD<\/span><\/div><\/div><\/div>`);\n}\n\n/* ====== day scrubber wiring ====== */\nfunction setDayUI(d){\n $(\"mLbl\").textContent=dstr(d,1);$(\"mLbl\").classList.toggle(\"past\",d!==LAT);\n const t=$(\"mTag\");t.classList.toggle(\"on\",d!==LAT);t.textContent=d>LAT?\"FORECAST\":\"MODEL\";\n $(\"mPrev\").disabled=d===0;$(\"mNext\").disabled=d===DMAX;\n $(\"hdrAvg\").textContent=f1(sysAvg(d));\n}\nKit.on((k,v,st)=>{\n if(k===\"d\"){Kit.hideTip();renderSC(1,v);recCursor(v);renderStrips(v);setDayUI(v);if(Kit.drawer.isOpen()&&st.pin!=null)openNvr(st.pin)}\n if(k===\"nvr\")applyNvr(v);\n if(k===\"pin\"&&v==null&&!Kit.drawer.isOpen())Kit.set(\"nvr\",null);\n});\n$(\"mPrev\").onclick=()=>Kit.set(\"d\",Math.max(0,Kit.st.d-1));\n$(\"mNext\").onclick=()=>Kit.set(\"d\",Math.min(DMAX,Kit.st.d+1));\n$(\"mLatest\").onclick=()=>Kit.set(\"d\",LAT);\n\n/* ====== story / presenter mode ====== */\nconst reset=()=>{Kit.set(\"nvr\",null);Kit.set(\"pin\",null);Kit.set(\"d\",LAT)};\nconst ST=Kit.story([\n {cards:[\"cS1\",\"cS2\",\"cS3\"],enter:reset,cap:()=>`<b>Only ${NV.filter((n,i)=>(i===1?retD(LAT):n.ret)>=REQ).length} of 3 NVRs keeps ${REQ} days.<\/b> System average ${f1(sysAvg(LAT))} d — NVR1 ${NV[0].ret}, NVR2 ${retD(LAT)}, NVR3 ${NV[2].ret}.`},\n {cards:[\"cS2\",\"cRec\"],enter:()=>{Kit.set(\"d\",LAT);Kit.set(\"nvr\",\"NVR2\")},leave:reset,cap:()=>`<b>NVR2 is recovering:<\/b> ${NV[1].ret} → ${retD(LAT)} days since ${dstr(0)}, about +${slope.toFixed(2)} d per day.`},\n {cards:[\"cMat\"],enter:()=>{Kit.set(\"d\",LAT);Kit.set(\"nvr\",\"NVR2\")},cap:()=>`<b>Frame rate is the lever:<\/b> ${f1(avgFps(1))} → ${f1(avgFps(0))} fps cuts bitrate per camera by ${Math.round(100-perCam(0)/perCam(1)*100)}%.`},\n {cards:[\"cDumb\",\"cCam\"],enter:()=>Kit.set(\"nvr\",\"NVR3\"),cap:()=>`<b>NVR3 is the odd one:<\/b> it writes ×${duty(2).toFixed(2)} its settings — ${GRP&&GRP.i===2?GRP.n+\" channels carry \"+(GRP.sh*100).toFixed(0)+\"% of the bitrate\":\"check the vendor\"}.`},\n {cards:[\"cRec\"],enter:()=>{Kit.set(\"nvr\",null);Kit.set(\"d\",T2)},cap:()=>`<b>${REQ} days on ${dstr(T2,1)}<\/b> if NVR2 records like NVR1${T2c!=null?` — as late as ${dstr(T2c,1)} if it records 24 h`:\"\"}.`},\n {cards:[\"cIns\",\"cFac\"],enter:()=>{Kit.set(\"d\",LAT);Kit.set(\"nvr\",null)},cap:()=>`<b>Next step:<\/b> adjust NVR3 like NVR1 (≈${T3-LAT} days to ${REQ} d) and confirm the recording mode on all three.`}\n]);\n$(\"btnStory\").onclick=()=>ST.active()?ST.stop():ST.start();\n\n/* ====== keyboard ====== */\naddEventListener(\"keydown\",e=>{\n if(e.target.closest&&e.target.closest(\"button\")&&(e.key===\"Enter\"||e.key===\" \"))return;\n if(ST.active()){\n  if(e.key===\"ArrowRight\"||e.key===\" \"||e.key===\"PageDown\"){e.preventDefault();ST.next()}\n  else if(e.key===\"ArrowLeft\"||e.key===\"PageUp\"){e.preventDefault();ST.prev()}\n  else if(e.key===\"Escape\"||e.key===\"p\"||e.key===\"P\")ST.stop();\n  return;\n }\n if(e.key===\"Escape\"){Kit.drawer.close();Kit.set(\"nvr\",null)}\n else if(e.key===\"ArrowLeft\"){Kit.set(\"d\",Math.max(0,Kit.st.d-1))}\n else if(e.key===\"ArrowRight\"){Kit.set(\"d\",Math.min(DMAX,Kit.st.d+1))}\n else if(e.key===\"Home\"||e.key===\"End\"){Kit.set(\"d\",LAT)}\n else if(e.key===\"p\"||e.key===\"P\"){ST.start()}\n});\n\n/* ====== init + entrance ====== */\nconst stageEl=$(\"stage\");\nbuildRec();\nif(!Kit.RM){stageEl.classList.add(\"intro\");stageEl.querySelectorAll(\".card\").forEach((c,k)=>c.style.animationDelay=(k*.06)+\"s\");setTimeout(()=>{stageEl.classList.remove(\"intro\");stageEl.querySelectorAll(\".card\").forEach(c=>c.style.animationDelay=\"\")},2600)}\nrenderSC(0,LAT);renderSC(2,LAT);\nKit.st.d=null;Kit.set(\"d\",LAT);\n\n/* ====== fit 16:10 stage to window ====== */\nfunction fit(){const s=Math.min(innerWidth/1600,innerHeight/1000);stageEl.style.transform=`scale(${s})`}\naddEventListener(\"resize\",fit);fit();\n<\/script>\n<script>/* GA SHELL BRIDGE (added by build_index.py, combined file only) */\n(()=>{if(parent===window)return;\nconst send=(t,x)=>parent.postMessage(Object.assign({ga:t},x||{}),\"*\");\nconst act=()=>{try{return ST.active()}catch(_){return false}};\nconst step1=()=>{const k=document.querySelector(\".cap .k,#cap .k\");return k?parseInt(k.textContent,10):0};\naddEventListener(\"keydown\",e=>{\n if(e.ctrlKey||e.metaKey||e.altKey)return;\n const k=e.key,was=act();\n const eat=()=>{e.preventDefault();e.stopImmediatePropagation()};\n if(/^[1-9]$/.test(k)){eat();send(\"go\",{n:+k});return}\n if(k===\"P\"&&e.shiftKey){eat();send(\"presentAll\");return}\n if(!was){\n  if(k===\"PageDown\"){eat();send(\"step\",{d:1})}\n  else if(k===\"PageUp\"){eat();send(\"step\",{d:-1})}\n  return;\n }\n if((k===\"PageUp\"||k===\"ArrowLeft\")&&step1()===1){send(\"storyBack\");return}\n setTimeout(()=>{if(!act())send(k===\"PageDown\"||k===\"ArrowRight\"||k===\" \"?\"storyEnd\":\"storyExit\")},0);\n},true);\naddEventListener(\"message\",e=>{const d=e.data||{};\n if(d.ga===\"story\"){try{if(!act())ST.start()}catch(_){}}\n if(d.ga===\"stop\"){try{if(act())ST.stop()}catch(_){}}\n});\nsend(\"ready\");\n})();\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script type="application/json" id="d06">"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Renovation Projects & Ad-hoc Requests<\/title>\n<\u0021--GA_FONTS-->\n<style>\n\n:root{\n  --paper:#F3F0E9; --card:#FFFFFF; --ink:#1B2230; --ink2:#4A5263; --mute:#8A8F98; --line:#E3DED3;\n  --navy:#13294B; --fy26:#13294B; --fy25:#6F8F72; --fy24:#C79B6B;\n  --up:#B8322A; --upSoft:#F4DDD9; --down:#2F6E95; --downSoft:#DCE8F0; --plot:#EEF1F5; --leaf:#4E7A4C; --amber:#E8B04A; --bw:#9AA6B8;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;background:#2A2F38;overflow:hidden}\nbody{font-family:\"IBM Plex Sans\",system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}\n.stage{width:1600px;height:1000px;background:var(--paper);position:relative;transform-origin:center center;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.35)}\n.num{font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-feature-settings:\"tnum\"}\n.hdr{position:absolute;left:0;top:0;width:100%;height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 28px;gap:18px}\n.hdr .idx{font-family:\"IBM Plex Mono\";font-size:15px;border:1px solid rgba(255,255,255,.4);padding:3px 9px;border-radius:3px}\n.hdr h1{font-weight:600;font-size:24px;letter-spacing:.2px}\n.hdr .meta{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.45;color:#C9D3E3}\n.hdr .meta b{color:#fff;font-weight:600}\n.accent{position:absolute;top:64px;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--up) 0 22%,#E8B04A 22% 30%,var(--fy25) 30% 100%)}\n.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px}\n.ttl{white-space:nowrap;font-family:\"IBM Plex Sans Condensed\",\"Arial Narrow\",\"IBM Plex Sans\",system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:1.4px;text-transform d{border-top:0}\n.ins li b{color:var(--ink);font-weight:600}\n.ins .ic{width:26px;height:26px}\n.lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}\n.lg i{display:inline-block;width:9px;height:9px;border-radius:2px}\n.foot{position:absolute;left:24px;right:24px;bottom:10px;font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between;gap:20px}\n.foot b{color:var(--ink2);font-weight:600}\nsvg text{font-family:\"IBM Plex Sans\",sans-serif}\nsvg text.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}\n\n/* ===== GA INTERACT KIT · styles (reusable) ===== */\n.hdr .meta{margin-left:18px}\n.ctl{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#C9D3E3}\n.ctl button{font:600 12px \"IBM Plex Sans\",sans-serif;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:4px;height:28px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}\n.ctl button:hover{background:rgba(255,255,255,.18)}\n.ctl button:focus-visible,.hit:focus-visible{outline:2px solid #E8B04A;outline-offset:2px}\n.ctl .mon{font:600 13px \"IBM Plex Mono\",monospace;color:#fff;min-width:64px;text-align:center}\n.ctl .mon.past{color:#E8B04A}\n.ctl .hint{font-size:11px;color:#8FA0BC;margin-left:6px;line-height:1.25}\n.card{transition:opacity .35s,filter .35s,box-shadow .35s,transform .35s}\n.card.dim{opacity:.16;filter:grayscale(.8)}\n.card.spot{box-shadow:0 0 0 3px var(--amber),0 12px 30px rgba(19,41,75,.18);z-index:5}\n.hit{cursor:pointer}\n#bldg .fz{transition:opacity .25s}\n#bldg .fz:focus{outline:none}\n#bldg .fz:focus-visible .rowbg{stroke:var(--amber);stroke-width:2}\n#bldg .fz text,#bldg .fz path,#bldg .fz circle{pointer-events:none}\n#bldg .fz.dim{opacity:.18}\n#bldg .fz.on .rowbg{fill:#F4EFE4}\n#bldg polygon.band{transition:opacity .25s,filter .25s}\n#bldg polygon.band.dim{opacity:.12}\n#bldg polygon.band.on{filter:drop-shadow(0 0 5px #FFD27A) brightness( 8FA0BC;white-space:nowrap}\n.cap b{color:#FFD27A}\n/* entrance */\n@keyframes rise{from{opacity:0;transform:translateY(10px)}}\n@keyframes gy{from{transform:scaleY(0)}}\n@keyframes gx{from{transform:scaleX(0)}}\n@keyframes lite{from{opacity:0}}\n.intro .card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}\n.intro .gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .7s cubic-bezier(.2,.8,.2,1) both}\n.intro .gx{transform-box:fill-box;transform-origin:0 50%;animation:gx .7s cubic-bezier(.2,.8,.2,1) both}\n.intro polygon.band{animation:lite .35s ease-out both}\n@media (prefers-reduced-motion: reduce){.intro *{animation:none!important}.card,.drawer,.tip,.cap{transition:none}}\n@media print{.ctl,.tip,.drawer,.cap{display:none!important}.card.dim{opacity:1;filter:none}}\n\n\n/* ===== shared components from 05 (chip, tg, stats, pend, lgd, drawer rows) ===== */\n.hdr h1{white-space:nowrap}\n.ctl .mtag{font:600 11px \"IBM Plex Mono\",monospace;letter-spacing:.6px;color:#1B2230;background:#E8B04A;border-radius:3px;padding:2px 6px;display:none}\n.ctl .mtag.on{display:inline-block}\n.chip{margin-left:auto;font:600 11px \"IBM Plex Sans\",sans-serif;letter-spacing:.7px;border-radius:3px;padding:2px 8px;text-transform:uppercase;white-space:nowrap}\n.chip.ok{background:#E0ECE0;color:#3F6B3E}.chip.mid{background:#F7EDCF;color:#8A6D1F}.chip.bad{background:var(--upSoft);color:var(--up)}\n.sc{margin-top:6px;border-radius:4px;outline-offset:3px}\n.sc:focus{outline:none}.sc:focus-visible{outline:2px solid var(--amber)}\n.rowA{display:flex;justify-content:space-between;align-items:flex-start;height:88px}\n.rowA .big small{font-size:15px;margin-left:6px;letter-spacing:0}\n.tg{display:inline-block;font:600 11px \"IBM Plex Mono\",monospace;padding:2px 6px;border-radius:3px;background:#ECE8DD;color:var(--ink2);margin-left:8px;vertical-align:middle;letter-spacing:.5px}\n.tg.f{background:#F7EDCF;color:#8A6D1F}\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}\n.stats span{display:block;font:600 11px \"IBM Plex Sans Condensed\",\"Arial Narrow\",sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--mute)}\n.stats b{font:600 15px \"IBM Plex Mono\",monospace;color:var(--ink)}\n.stats s{color:var(--mute);font:500 11px \"IBM Plex Mono\",monospace;margin-left:5px}\n.nv{transition:opacity .25s}.nv.dim{opacity:.22}\ng.hit:focus{outline:none}g.hit:focus-visible .rowbg{stroke:var(--amber);stroke-width:2}\n.pend{display:inline-block;font:600 11px \"IBM Plex Mono\",monospace;padding:1px 7px;border-radius:3px;color:#8A6D1F;background:repeating-linear-gradient(135deg,#F7EDCF 0 4px,#FBF6E4 4px 8px);letter-spacing:.5px}\n.lgd{display:flex;gap:14px;margin-top:3px;font-size:11px;color:var(--ink2);white-space:nowrap}\n.lgd span{display:inline-flex;align-items:center;gap:5px}\n.lgd svg{flex:none}\n.drawer .rw{display:flex;justify-content:space-between;gap:10px;font:500 12px \"IBM Plex Mono\",monospace;padding:2px 0;color:var(--ink2)}\n.drawer .rw b{color:var(--ink)}\n.drawer .ac{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.35;color:var(--ink2)}\n.drawer .ac:first-of-type{border-top:0}\n.drawer .ac i{font:600 11px/20px \"IBM Plex Mono\",monospace;width:20px;height:20px;border-radius:50%;text-align:center;color:#fff;font-style:normal}\n.drawer .ac div span{display:inline-block;margin-top:3px;margin-right:6px}\n.ins li svg.ic{width:26px;height:26px}\n.factor li{font-size:12.5px;padding:5px 0 5px 34px;line-height:1.3}\n.factor li::before{top:5px}\n.ins li{font-size:12.5px}\n/* ===== Dashboard 06 · Renovation additions (Layout F · Move-in board) ===== */\n.fx{transition:opacity .25s}.fx.fd{opacity:.2}\ng.fx.on .rowbg{fill:#F4EFE4}\n.fx text,.fx path,.fx circle,.fx line{pointer-events:none}\n/* KPI band */\n.kt{padding:12px 16px}\n.kt .ttl{font-size:12px}\n.kt .v{display:flex;align-items focus-visible{outline:2px solid var(--amber)}\n.al .r .f{font:600 11px \"IBM Plex Mono\",monospace;color:#fff;background:var(--navy);border-radius:3px;text-align:center;padding:2px 0;margin-left:4px}\n.al .r .i{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.al .r .i em{font-style:normal;color:var(--mute);font-size:11.5px}\n.al .r .d{font:500 11px \"IBM Plex Mono\",monospace;color:var(--ink2);text-align:right}\n.al .r .d.na{color:#B9B2A6}\n.al .r .p{white-space:nowrap;font:700 11px \"IBM Plex Mono\",monospace;letter-spacing:.5px;text-align:center;border-radius:3px;padding:3px 0;margin-right:4px}\n.p.dn{background:#E0ECE0;color:#3F6B3E}.p.cx{background:#ECE8DD;color:var(--mute);text-decoration:line-through}.p.op{background:#E8B04A;color:#1B2230}.p.du{background:#F7EDCF;color:#8A6D1F}\n.al .r.cx .i{color:var(--mute);text-decoration:line-through}\n/* tower */\n#tw g.fx.on .rowbg{fill:#F4EFE4}\n#tw .lab text{pointer-events:none}\n#tw g.fl.on .face{filter:drop-shadow(0 0 6px #FFD27A)}\n/* months ahead */\n.ahead{position:absolute;left:574px;top:62px;width:244px;display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.ahead div{border:1px solid var(--line);border-radius:4px;padding:8px 9px;height:118px}\n.ahead div.pk{border-color:#E8B04A;background:#FBF4E2}\n.ahead h6{font:600 11px \"IBM Plex Sans Condensed\",\"Arial Narrow\",sans-serif;letter-spacing:1.2px;color:var(--mute);display:flex;justify-content:space-between}\n.ahead h6 b{font:600 15px \"IBM Plex Mono\",monospace;color:var(--ink);letter-spacing:0}\n.ahead p{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}\n.ahead p span{font:600 11px \"IBM Plex Mono\",monospace;color:#fff;background:var(--navy);border-radius:3px;padding:1px 5px}\n.ahead p span.e{background:var(--down)}\n/* ad-hoc tickets */\n.tk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}\n.tk .t{position:relative;height:60px;border:1px solid var(--line);border-top:2px dashed #CFC8BA;border-radius:3px 3px 5px 5px;background:# SEP26), cleaned in RENO_ADHOC_CLEAN.xlsx (4 Oct 2026)\n   Add a month: append its label to SN and its as-of date to ASOF, then add one entry to every PJ[i].s\n   (null = project not yet in the portfolio). Ad-hoc: append rows to AH.\n   PJ   : fl = floor · type O original plan / A addition to original plan / N new addition\n          plan = planned move-in · act = actual move-in / ready-for-use date (shown once status = Complete)\n          s[m] = [pct complete 0–1, status, schedule risk]\n   AH   : [request date | null = not recorded, floor, requester, item (EN), (unused), category, latest status, [status per snapshot], done date | null]\n          5F electric film: requested 12 Sep (sheet said 12 Aug), done 3 Oct — confirmed by Micky 4 Oct\n          \"closed this month\" = Done/Cancel now but open in the previous log (no completion-date column in the source)\n   Confirmed by Micky 4 Oct 2026: 15FL plan 1 Sep, moved in 30 Aug · 12FL Umai complete, ready for use 7 Oct ·\n   3FL/5FL = additions to the original plan · ad-hoc dates not recorded for 3 rows (work done) · 18F HR = 1 desk.\n   ESTIMATE: 5FL Sep 30% (sheet 15%) — quotation received in Sep, installation in Nov per plan.\n   Ad-hoc desk jobs are also counted as vendor jobs in 07 PM & Repair (shown in both, by decision 4 Oct).\n   ===================================================================== */\nconst SN=[\"Aug 26\",\"Sep 26\"];\nconst ASOF=[\"2026-08-31\",\"2026-09-30\"];\nconst PJ=[\n {\"fl\": 15, \"name\": \"New Office\", \"type\": \"O\", \"plan\": \"2026-09-01\", \"act\": \"2026-08-30\", \"s\": [[1, \"Complete\", \"Complete\"], [1, \"Complete\", \"Complete\"]]},\n {\"fl\": 12, \"name\": \"Umami Kitchen (CEC)\", \"type\": \"O\", \"plan\": \"2026-12-01\", \"act\": null, \"s\": [[0.42, \"In Progress\", \"On track\"], [0.45, \"In Progress\", \"On track\"]]},\n {\"fl\": 12, \"name\": \"Umai Kitchen\", \"type\": \"O\", \"plan\": \"2026-11-01\", \"act\": \"2026-10-07\", \"s\": [[0.46, \"In Progress\", \"On track\"], [1, \"Complete\", \"Complete\"]]},\n {\"fl\": 3, \"name\": \"Office (NEW)\", \"type\": \"A\", \"plan\": \"2026-12-01\", \"act\": null, \"s\": [[0.3, \"In Progress\", \"Monitor\"], [0.4, \"In Progress\", \"On track\"]]},\n {\"fl\": 5, \"name\": \"Change Furniture\", \"type\": \"A\", \"plan\": \"2026-12-01\", \"act\": null, \"s\": [[0.15, \"In Progress\", \"On track\"], [0.3, \"In Progress\", \"On track\"]]},\n {\"fl\": 9, \"name\": \"IA / Legal / Compliance\", \"type\": \"N\", \"plan\": \"2026-12-01\", \"act\": null, \"s\": [null, [0.3, \"In Progress\", \"On track\"]]},\n {\"fl\": 17, \"name\": \"NBC minor renovation\", \"type\": \"N\", \"plan\": \"2026-12-01\", \"act\": null, \"s\": [null, [0.3, \"In Progress\", \"On track\"]]},\n {\"fl\": 11, \"name\": \"CPD minor renovation\", \"type\": \"N\", \"plan\": \"2026-12-01\", \"act\": null, \"s\": [null, [0.4, \"In Progress\", \"On track\"]]},\n {\"fl\": 12, \"name\": \"Foundation office\", \"type\": \"N\", \"plan\": \"2027-01-15\", \"act\": null, \"s\": [null, [0.2, \"In Progress\", \"On track\"]]},\n];\nconst AH=[\n [\"2026-04-24\", 8, \"T-FTC\", \"Zone A–B desk rework: buy 4 double-desk sets, remove 4 manager desks\", null, \"Desks / furniture\", \"Done\", [null, \"Done\"], null],\n [\"2026-05-17\", 14, null, \"Add 2 staff desk sets (KOKUYO)\", null, \"Desks / furniture\", \"Done\", [\"Done\", \"Done\"], null],\n [\"2026-05-24\", 16, \"BU\", \"+1 manager, +5 staff desks\", null, \"Desks / furniture\", \"Done\", [\"Done\", \"Done\"], null],\n [\"2026-06-28\", 3, null, \"Install manager desk, Zone C (Thai Chiwanon)\", null, \"Desks / furniture\", \"Done\", [\"Done\", \"Done\"], null],\n [\"2026-07-04\", 15, null, \"Replace staff desk tops (KOKUYO)\", null, \"Desks / furniture\", \"Done\", [\"Done\", \"Done\"], null],\n [\"2026-08-06\", 5, \"President\", \"Install posters, President's room\", null, \"Room fit-out\", \"Done\", [null, \"Done\"], null],\n [\"2026-09-12\", 5, \"President\", \"Install switchable (electric) window film, President's room\", null, \"Room fit-out\", \"Done\", [null, \"Done\"], \"2026-10-03\"],\n [null, 5, \"IS\", \"+2 staff desks\", null, \"Desks / furniture\", \"Done\", [\"Done\", \"Done\"], null],\n [null, 18, \"HR\", \"+1 staff desk\", null, \"Desks / furniture\", \"Done\", [\"Due Sep\", \"Done\"], null],\n [null, 18, \"GA\", \"+2 staff desks\", null, \"Desks / furniture\", \"Cancel\", [\"Due Sep\", \"Cancel\"], null],\n];\n\n/* ===== GA INTERACT KIT (copied unchanged from 05) ===== */\nconst Kit=(()=>{\n const stage=document.getElementById(\"stage\"), st={}, subs=[];\n const RM=matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n const set=(k,v)=>{if(st[k]===v)return;st[k]=v;subs.forEach(f=>f(k,v,st))};\n const on=f=>subs.push(f);\n /* tooltip (positioned in stage coordinates, flips at edges) */\n const tipEl=document.getElementById(\"tip\");\n const toStage=(cx,cy)=>{const r=stage.getBoundingClientRect(),k=r.width/1600;return [(cx-r.left)/k,(cy-r.top)/k]};\n const place=(x,y)=>{const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let px=x+16,py=y+16;if(px+w>1590)px=x-w-16;if(py+h>990)py=y-h-16;tipEl.style.left=px+\"px\";tipEl.style.top=py+\"px\"};\n const tip=(el,html)=>{\n  el.addEventListener(\"mouseenter\",e=>{tipEl.innerHTML=html();tipEl.classList.add(\"on\");place(...toStage(e.clientX,e.clientY))});\n  el.addEventListener(\"mousemove\",e=>place(...toStage(e.clientX,e.clientY)));\n  el.addEventListener(\"mouseleave\",()=>tipEl.classList.remove(\"on\"));\n  el.addEventListener(\"focus\",()=>{const b=el.getBoundingClientRect();tipEl.innerHTML=html();tipEl.classList.add(\"on\");place(...toStage(b.right,b.top))});\n  el.addEventListener(\"blur\",()=>tipEl.classList.remove(\"on\"));\n };\n const hideTip=()=>tipEl.classList.remove(\"on\");\n /* count-up */\n const count=(el,to,f,ms=900)=>{if(RM){el.textContent=f(to);return}const t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)};\n /* drawer */\n const dEl=document.getElementById(\"drawer\"),dBody=document.getElementById(\"dBody\");\n const drawer={open:h=>{dBody.innerHTML=h;dEl.classList.add(\"open\");dEl.setAttribute(\"aria-hidden\",\"false\")},close:()=>{dEl.classList.remove(\"open\");dEl.setAttribute(\"aria-hidden\",\"true\");set(\"pin\",null)},isOpen:()=>dEl.classList.contains(\"open\")};\n document.getElementById(\"dClose\").addEventListener(\"click\",drawer.close);\n /* presenter / story mode */\n const capEl=document.getElementById(\"cap\");\n const story=steps=>{\n  let i=-1;\n  const cards=[...stage.querySelectorAll(\".card\")];\n  const show=()=>{\n   const s=steps[i];hideTip();\n   cards.forEach(c=>{const on=s.cards.includes(c.id);c.classList.toggle(\"dim\",!on);c.classList.toggle(\"spot\",on)});\n   if(s.enter)s.enter();\n   capEl.innerHTML=`<span class=\"k\">${i+1} / ${steps.length}<\/span><span>${s.cap()}<\/span><span class=\"h\">← → · Esc<\/span>`;capEl.classList.add(\"on\");\n  };\n  const stop=()=>{if(i<0)return;i=-1;cards.forEach(c=>c.classList.remove(\"dim\",\"spot\"));capEl.classList.remove(\"on\");steps.forEach(s=>s.leave&&s.leave())};\n  return {active:()=>i>=0,start:()=>{drawer.close();i=0;show()},stop,next:()=>{if(i<steps.length-1){i++;show()}else stop()},prev:()=>{if(i>0){i--;show()}}};\n };\n return {st,set,on,tip,hideTip,count,drawer,story,RM};\n})();\n\n/* ====== helpers ====== */\nconst NS=\"http://www.w3.org/2000/svg\";\nconst el=(p,t,a={},txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e};\nconst $=id=>document.getElementById(id);\nconst sum=a=>a.reduce((s,x)=>s+(x||0),0);\nconst MON=[\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"];\nconst D=s=>{const [y,m,d]=s.split(\"-\").map(Number);return new Date(y,m-1,d)};\nconst ds=(s,y)=>{const t=typeof s===\"string\"?D
